<head>

<title>家族アプリ</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#22302c; --sub:#6b7773; --line:#e4e0d6;
  --main:#2f7d6d; --main-soft:#dcefe9; --warn:#d9822b; --bad:#c8453c; --good:#3a9a5b;
  --c-dad:#3b6fb6; --c-mom:#c0558f; --c-ryuta:#2f8f5b; --c-akari:#e08a1e; --c-shiori:#8a5cc7;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141a18; --card:#1e2624; --ink:#e8eeec; --sub:#9aa7a3; --line:#2e3936; --main:#5fbfa8; --main-soft:#23403a; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#141a18; --card:#1e2624; --ink:#e8eeec; --sub:#9aa7a3; --line:#2e3936; --main:#5fbfa8; --main-soft:#23403a; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 16px;background:var(--main);color:#fff;font-weight:700}
button.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
button.soft{background:var(--main-soft);color:var(--main)}
button.bad{background:var(--bad)} button.warn{background:var(--warn)} button.small{padding:8px 12px;font-size:14px}
button:disabled{opacity:.4}
input,select,textarea{font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
.wrap{max-width:640px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .who{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header.top .date{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:18px}
.avatar.big{width:84px;height:84px;font-size:32px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--main-soft);color:var(--main)}
.pill.warn{background:#fbe8d4;color:#9a520f}.pill.bad{background:#f7dad7;color:#9c2c25}.pill.good{background:#d9f0df;color:#226b3a}.pill.gray{background:var(--line);color:var(--sub)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;color:var(--sub);border-radius:0;padding:10px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:22px}
nav.tabs button.on{color:var(--main)}
.badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.login{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.login button{background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:16px auto}
.pin button{font-size:24px;padding:18px;background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dots{display:flex;justify-content:center;gap:14px;margin:12px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--main)}
.dots span.f{background:var(--main)}
.routine{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.routine:first-of-type{border-top:none}
.routine .time{font-variant-numeric:tabular-nums;font-weight:700;width:52px;flex:none}
.tl{position:relative;padding-left:8px}
.tl-item{display:flex;gap:10px;align-items:center;padding:8px 0}
.tl-bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
.now-line{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:12px;font-weight:700;margin:4px 0}
.now-line:after{content:"";flex:1;height:2px;background:var(--bad)}
.points-big{font-size:56px;font-weight:800;text-align:center;line-height:1;margin:8px 0}
.hist{padding:10px 0;border-top:1px solid var(--line)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;width:56px;text-align:right;flex:none}
.amt.plus{color:var(--good)} .amt.minus{color:var(--bad)}
.ring{display:block;margin:0 auto}
.ring-text{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.kid-timer{display:flex;align-items:center;gap:12px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--main)}
.days{display:flex;gap:6px}
.days label{margin:0;flex:1}
.days input{display:none}
.days span{display:block;text-align:center;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);color:var(--ink);font-weight:700}
.days input:checked+span{background:var(--main);border-color:var(--main);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button.sel{outline:3px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:30;max-width:90%;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.empty{text-align:center;color:var(--sub);padding:18px 0}
.mascot{display:flex;gap:12px;align-items:center}
.bubble{background:var(--main-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin-top:4px;font-weight:600;line-height:1.5}
.bubble.big{font-size:18px;margin-top:12px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.kidset{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.datechips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.datechip{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:17px;border-radius:12px}
.datechip small{font-size:11px;color:var(--sub);font-weight:600}
.datechip.we small{color:var(--bad)}
.datechip.on{background:var(--main);border-color:var(--main);color:#fff}.datechip.on small{color:#fff}
.dowgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dowgrid label{margin:0;text-align:center;font-weight:700;color:var(--ink)}
.dowgrid label.we span{color:var(--bad)}
.dowgrid input{padding:8px 2px;text-align:center;margin-top:2px}
.big-mode{font-size:19px}
.big-mode button{padding:16px 20px}
.alarm{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   家族アプリ
   - config.js に Firebase の設定があれば、家族の端末どうしで同期
   - なければ、この端末だけに保存する「お試しモード」
   家族の名前などはすべてデータ側に保存し、コードには入れない
   ========================================================= */

const DOW = ['日','月','火','水','木','金','土'];
const COLORS = ['#3b6fb6','#c0558f','#2f8f5b','#e08a1e','#8a5cc7','#1f8fa8','#b5523b'];
const members = () => Store.data?.members || [];
const kids = () => members().filter(m=>m.role==='kid');
const M = id => members().find(m=>m.id===id);
const COLLS = ['routines','logs','points','timers'];

/* ---------- サーバー時刻（端末の時計をずらしてもズレない） ---------- */
let clockOffset = 0;
function now(){ return Date.now() + clockOffset }

async function sha(s){
  try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('family-app:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('') }
  catch(e){ return 'plain:'+s }
}
function clone(x){ return JSON.parse(JSON.stringify(x ?? null)) }
function emptyData(){ return {members:[], settings:{pins:{},allowance:{},simple:{}}, joinCode:null, routines:[], logs:[], points:[], timers:{}} }

/* ---------- 保存先：この端末だけ ---------- */
const LocalBackend = {
  KEY:'familyApp.local.v1',
  async start(){
    let d=null; try{ d=JSON.parse(localStorage.getItem(this.KEY)) }catch(e){}
    Store.data = d || null; Store.state = d ? 'ready' : 'nofamily'; render();
    window.addEventListener('storage', e=>{ if(e.key===this.KEY){ try{ Store.data=JSON.parse(e.newValue) }catch(_){} render() } });
  },
  async createFamily(data){ Store.data=data; this.write(); Store.state='ready' },
  async joinFamily(){ throw new Error('お試しモードでは家族コードは使えません') },
  write(){ try{ localStorage.setItem(this.KEY, JSON.stringify(Store.data)) }catch(e){} },
  async leave(){ try{ localStorage.removeItem(this.KEY) }catch(e){} Store.data=null; Store.state='nofamily' },
};

/* ---------- 保存先：Firebase（家族で同期） ---------- */
const FireBackend = {
  db:null, uid:null, fid:null, unsubs:[], day:null,
  async start(){
    firebase.initializeApp(window.FIREBASE_CONFIG);
    this.db = firebase.firestore();
    if(window.FIREBASE_EMULATOR){ firebase.auth().useEmulator('http://127.0.0.1:9099'); this.db.useEmulator('127.0.0.1', 8080) } // 開発用
    try{ await this.db.enablePersistence({synchronizeTabs:true}) }catch(e){}
    const cred = await firebase.auth().signInAnonymously();
    this.uid = cred.user.uid;
    let fid=null; try{ fid=localStorage.getItem('familyApp.fid') }catch(e){}
    if(fid){ try{ await this.attach(fid); return }catch(e){ console.warn(e) } }
    Store.state='nofamily'; render();
  },
  fam(){ return this.db.collection('families').doc(this.fid) },
  async attach(fid){
    this.fid=fid;
    const dev=this.fam().collection('devices').doc(this.uid);
    await dev.set({seen: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    try{ const s=await dev.get({source:'server'}); const t=s.data().seen?.toMillis(); if(t) clockOffset = t - Date.now() }catch(e){}
    try{ localStorage.setItem('familyApp.fid', fid) }catch(e){}
    Store.data = Store.data || emptyData();
    this.listen();
  },
  listen(){
    this.unsubs.forEach(u=>u()); this.unsubs=[];
    this.day = today();
    const since = today(new Date(Date.now()-14*864e5));
    const f=this.fam(), d=()=>Store.data;
    let first=true;
    this.unsubs.push(f.onSnapshot(s=>{
      if(!s.exists){ return }
      const v=s.data(); d().members=v.members||[]; d().settings=v.settings||{pins:{},allowance:{},simple:{}}; d().joinCode=v.joinCode||null;
      if(first){ first=false; Store.state='ready' } render();
    }, err=>{ console.warn(err); this.fail() }));
    const coll=(name, q)=> this.unsubs.push(q.onSnapshot(s=>{
      if(name==='timers'){ const o={}; s.forEach(x=>o[x.id]=x.data()); d().timers=o }
      else d()[name]=s.docs.map(x=>({id:x.id, ...x.data()}));
      render();
    }, err=>console.warn(name, err)));
    coll('routines', f.collection('routines'));
    coll('logs', f.collection('logs').where('date','>=',since));
    coll('points', f.collection('points'));
    coll('timers', f.collection('timers').where('date','==',this.day));
  },
  fail(){ try{ localStorage.removeItem('familyApp.fid') }catch(e){} this.unsubs.forEach(u=>u()); this.unsubs=[]; Store.data=null; Store.state='nofamily'; render() },
  async createFamily(data){
    const ref=this.db.collection('families').doc();
    const code=joinCodeGen();
    await ref.set({owner:this.uid, members:data.members, settings:data.settings, joinCode:code, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    this.fid=ref.id;
    await ref.collection('devices').doc(this.uid).set({seen: firebase.firestore.FieldValue.serverTimestamp()});
    await this.db.collection('joinCodes').doc(code).set({fid:ref.id});
    Store.data=emptyData();
    await this.attach(ref.id);
  },
  async joinFamily(code){
    code=code.trim().toUpperCase();
    const j=await this.db.collection('joinCodes').doc(code).get();
    if(!j.exists) throw new Error('家族コードが見つかりません');
    const fid=j.data().fid;
    await this.db.collection('families').doc(fid).collection('devices').doc(this.uid).set({code, seen: firebase.firestore.FieldValue.serverTimestamp()});
    Store.data=emptyData();
    await this.attach(fid);
  },
  write(before, after){
    const f=this.fam(), batch=this.db.batch(); let n=0;
    if(JSON.stringify([before.members,before.settings])!==JSON.stringify([after.members,after.settings])){ batch.update(f,{members:clone(after.members), settings:clone(after.settings)}); n++ }
    for(const c of ['routines','logs','points']){
      const b=new Map(before[c].map(x=>[x.id,JSON.stringify(x)])), a=new Map(after[c].map(x=>[x.id,x]));
      for(const [id,x] of a){ if(b.get(id)!==JSON.stringify(x)){ const {id:_,...rest}=x; batch.set(f.collection(c).doc(id), clone(rest)); n++ } }
      for(const id of b.keys()) if(!a.has(id)){ batch.delete(f.collection(c).doc(id)); n++ }
    }
    for(const [k,t] of Object.entries(after.timers)){ if(JSON.stringify(before.timers[k])!==JSON.stringify(t)){ batch.set(f.collection('timers').doc(k), clone({...t, date:k.split('|')[1]})); n++ } }
    if(n) batch.commit().catch(e=>{ console.warn(e); toast('保存できませんでした。通信を確認してください') });
  },
  async leave(){ try{ await this.fam().collection('devices').doc(this.uid).delete() }catch(e){} this.fail() },
};
function joinCodeGen(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const r=crypto.getRandomValues(new Uint32Array(8)); for(const x of r) s+=A[x%A.length]; return s }

const Backend = window.FIREBASE_CONFIG ? FireBackend : LocalBackend;
const Store = {
  data:null, state:'loading',
  update(fn){
    const before=clone(this.data); fn(this.data);
    if(Backend===LocalBackend) LocalBackend.write(); else FireBackend.write(before, this.data);
    render();
  },
};

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36) }

function today(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function hm(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') }
function toMin(s){ const [h,m]=s.split(':').map(Number); return h*60+m }
function fromMin(n){ return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0') }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes() }
function fmtDur(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') }
function dateLabel(){ const d=new Date(); return (d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）' }

/* ---------- Domain ---------- */
const D = () => Store.data;
/* 予定には2種類：毎週（曜日）と、日にち指定（日ごとに時間を変えられる） */
function dateOf(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) }
function addDays(s,n){ const d=dateOf(s); d.setDate(d.getDate()+n); return today(d) }
function mdLabel(s){ const d=dateOf(s); const rel={[today()]:'きょう',[addDays(today(),1)]:'あした'}[s]; return rel || `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）` }
function routinesOn(date, member){
  const dow=dateOf(date).getDay(), out=[];
  for(const r of D().routines){
    if(r.status!=='approved' || (member && r.owner!==member)) continue;
    if(r.kind==='dates'){ const sl=(r.slots||[]).find(x=>x.date===date); if(sl) out.push({...r, start:sl.start}) }
    else if((r.days||[]).includes(dow)) out.push(r);
  }
  return out.sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function todaysRoutines(member){ return routinesOn(today(), member) }
function schedLabel(r){
  if(r.kind!=='dates') return `毎週 ${(r.days||[]).map(i=>DOW[i]).join('')} ${r.start}〜`;
  const up=(r.slots||[]).filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));
  if(!up.length) return '予定は終わりました';
  return up.slice(0,4).map(x=>`${mdLabel(x.date)} ${x.start}`).join('、')+(up.length>4?` ほか${up.length-4}日`:'');
}
function logFor(rid, date=today()){ return D().logs.find(l=>l.routine===rid && l.date===date) }
function routineState(r, date=today()){
  const l = logFor(r.id, date);
  if(l) return l.state;
  if(date<today()) return 'missed';
  if(date===today() && nowMin() > toMin(r.start)+r.dur+30) return 'missed';
  return 'todo';
}
const STATE_LABEL = {
  todo:['まだ','gray'], running:['とりくみ中','warn'], done:['できた！','good'], review:['確認待ち','warn'],
  approved:['できた！','good'], missed:['わすれてる？','bad'], excuse:['理由を確認中','warn'],
  excused:['お休みOK','gray'], skipped:['サボり','bad'],
};
/* 使えるポイント（もらった分 − 減点 − ゲームに交換した分） */
function pointsTotal(member){ return D().points.filter(p=>p.member===member).reduce((s,p)=>s+p.amount,0) }

function timerKey(kid){ return kid+'|'+today() }
function timer(kid){ return D().timers[timerKey(kid)] || {used:0, since:null, extra:0} }
function isWeekend(d=new Date()){ return d.getDay()===0||d.getDay()===6 }
/* ゲーム時間：日にち指定 ＞ 曜日ごと ＞（古い設定）平日/土日 の順で決める */
function allowanceDow(kid, dow){ const s=D().settings, v=s.allowanceDow?.[kid]?.[dow]; if(v!=null && v!=='') return Number(v); return (dow===0||dow===6) ? (s.allowanceWeekend?.[kid] ?? s.allowance[kid] ?? 60) : (s.allowance[kid] ?? 60) }
function allowanceOn(kid, date){ const o=D().settings.allowanceDate?.[kid]?.[date]; return o!=null ? Number(o) : allowanceDow(kid, dateOf(date).getDay()) }
function allowanceToday(kid){ return allowanceOn(kid, today()) }
function allowanceReason(kid){ return D().settings.allowanceDate?.[kid]?.[today()]!=null ? 'きょうだけの持ち時間' : DOW[new Date().getDay()]+'曜日の持ち時間' }
function timerLimit(kid){ const t=timer(kid); return (allowanceToday(kid) + (t.extra||0) + (t.bought||0)) * 60000 }
function timerUsed(kid){ const t=timer(kid); return t.used + (t.since ? now()-t.since : 0) }
function timerLeft(kid){ return Math.max(0, timerLimit(kid)-timerUsed(kid)) }

function pendingCount(){
  const d=D();
  return d.routines.filter(r=>r.status==='pending').length
    + d.logs.filter(l=>l.state==='review'||l.state==='excuse').length;
}

/* ---------- Session / UI state ---------- */
const ui = { user: null, tab:'home', pinFor:null, pin:'', modal:null, toast:null };
try{ ui.user = sessionStorage.getItem('saito.user') }catch(e){}
function me(){ return Store.state==='ready' ? M(ui.user) : null }
function isParent(){ return me()?.role==='parent' }
function toast(msg){ ui.toast=msg; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{ui.toast=null;render()},2200) }

/* ---------- きょうの達成状況とランキング ---------- */
const DONE_STATES=['done','approved','excused','review'];
function dayProgress(kid){
  const rs=todaysRoutines(kid), done=rs.filter(r=>DONE_STATES.includes(routineState(r))).length;
  return {total:rs.length, done, all: rs.length>0 && done===rs.length};
}
function progressBadge(kid){
  const p=dayProgress(kid);
  if(!isPlanned(kid) && !p.all) return '<span class="pill bad">リスト未登録</span>';
  if(!p.total) return '<span class="pill gray">予定なし</span>';
  return p.all ? '<span class="pill good">✔ ぜんぶ完了</span>' : `<span class="pill warn">${p.done}/${p.total}</span>`;
}
function progressRow(k){
  const p=dayProgress(k.id), pct=p.total?p.done/p.total*100:0;
  return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)">${avatar(k)}<div class="grow"><div class="row"><b class="grow">${esc(k.name)}</b>${progressBadge(k.id)}</div>
    <div class="bar" style="margin-top:6px"><i style="width:${pct}%;background:${p.all?'var(--good)':k.color}"></i></div></div></div>`;
}
function weekStart(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime() }
function ranking(range){
  const from = range==='week' ? weekStart() : 0;
  return kids().map(k=>({k, pts:D().points.filter(p=>p.member===k.id && p.at>=from && p.type!=='spend').reduce((s,p)=>s+p.amount,0)})).sort((a,b)=>b.pts-a.pts);
}
function rankingCard(){
  const range=ui.rankRange||'week', list=ranking(range), medals=['🥇','🥈','🥉'];
  let place=0, prev=null;
  const rows=list.map((x,i)=>{ if(x.pts!==prev){ place=i; prev=x.pts } const isMe=me()?.id===x.k.id;
    return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line);${isMe?'background:var(--main-soft);border-radius:12px;padding-inline:8px':''}"><div style="width:32px;font-size:22px;text-align:center">${medals[place]||place+1}</div>${avatar(x.k)}<b class="grow">${esc(x.k.name)}</b><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">${x.pts}</span><span class="muted">pt</span></div>` }).join('');
  const fam=list.reduce((s,x)=>s+x.pts,0);
  return `<div class="card"><div class="row"><h2 class="grow">ランキング</h2><div class="row" style="gap:6px"><button class="small ${range==='week'?'':'soft'}" data-act="rank" data-r="week">今週</button><button class="small ${range==='all'?'':'soft'}" data-act="rank" data-r="all">これまで</button></div></div>
    ${rows}<p class="muted" style="margin:10px 0 0">家族みんなで ${range==='week'?'今週':'これまで'} <b>${fam} pt</b>。助け合ってみんなでふやそう！</p></div>`;
}
/* ---------- やること優先：ゲームに使える時間 ---------- */
function cutoffMin(kid){ const v=D().settings.gameCutoff?.[kid]; return v ? toMin(v) : bedMin(kid)-deadlineBuf() }
function gameClosed(kid){ return !!timer(kid).closed || nowMin()>=cutoffMin(kid) }
// のこりのやることを締め切りまでに終わらせるのに必要な時間をのぞいた「ゆとり」
function gameSlack(kid){ const w=workload(kid); if(!w.remain.length) return Infinity; const ms=(dateOf(today()).getTime()+deadlineMin(kid)*60000)-now(); return ms - w.need*60000 }
function usableLeft(kid){
  if(gameClosed(kid)) return 0;
  const untilCut=(dateOf(today()).getTime()+cutoffMin(kid)*60000)-now();
  return Math.max(0, Math.min(timerLeft(kid), gameSlack(kid), untilCut));
}
function gameLockReason(kid){
  if(gameClosed(kid)) return `きょうのゲームは ${fromMin(cutoffMin(kid))} でおしまい`;
  if(timerLeft(kid)<=0) return 'きょうの持ち時間はおしまい';
  if(gameSlack(kid)<=0) return 'やることが締め切りに間に合わなくなるので、いまはゲームできないよ。先にやることを終わらせよう！';
  return '';
}
/* ---------- 締め切りまでに全部おわったらプレゼントポイント ---------- */
function bonusPts(which='pm'){ const st=D().settings; return Number(which==='am' ? (st.bonusPointsAM ?? st.bonusPoints ?? 5) : (st.bonusPoints ?? 5)) }
/* 朝（家を出るまで）と夜（寝るまで）それぞれで判定 */
function bonusWindows(kid){
  const st=D().settings, dep=departMin(kid), out=[];
  if(dep!=null) out.push({which:'am', from:0, to:dep, deadline:dep-Number(st.morningBuffer ?? 10), planKey:'plannedAM', msg:'🎁 朝の締め切りまでにぜんぶ完了ボーナス'});
  out.push({which:'pm', from:dep??0, to:24*60, deadline:bedMin(kid)-deadlineBuf(), planKey:'planned', msg:'🎁 夜の締め切りまでにぜんぶ完了ボーナス'});
  return out;
}
function checkBonus(kid){
  const T=today();
  for(const w of bonusWindows(kid)){
    const pts=bonusPts(w.which), id=`bonus-${w.which}-${kid}-${T}`;
    if(pts<=0 || D().points.some(p=>p.id===id)) continue;
    const rs=todaysRoutines(kid).filter(r=>{ const m=toMin(r.start); return m>=w.from && m<w.to });
    if(!rs.length || !timer(kid)[w.planKey]) continue;
    const dl=dateOf(T).getTime()+w.deadline*60000;
    const ok=rs.every(r=>{ const l=logFor(r.id,T); if(!l) return false; if(l.state==='excused') return true; return ['done','approved','review'].includes(l.state) && l.endedAt && l.endedAt<=dl });
    if(!ok) continue;
    // 同じIDで保存するので、ほかの端末と同時に判定しても1回だけ
    Store.update(d=>{ if(!d.points.some(p=>p.id===id)) d.points.push({id, member:kid, amount:pts, msg:w.msg, from:'auto', at:now(), type:'bonus'}) });
  }
}
/* ---------- きょうのやることリスト（毎日さいしょに登録） ---------- */
function nextFreeStart(kid){
  const rs=sessionRoutines(kid).filter(r=>!['done','approved','excused','review'].includes(routineState(r)));
  const ss=session(kid); let t=Math.max(ss.from, Math.ceil((nowMin()+5)/5)*5);
  for(const r of rs) t=Math.max(t, toMin(r.start)+r.dur);
  return fromMin(Math.min(t, 23*60+55));
}

  const text=pickLine(type, ev.key, {...ev.v, name:M(kid)?.name});

  return `<div class="card" style="border:2px solid var(--warn)">
    <h2>📝 ${ss.id==='am'?'朝の':ss.label==='放課後'?'放課後の':'きょうの'}やることリスト</h2>
    ${ss.id==='am'?`<p class="muted" style="margin-top:-6px">家を出る ${fromMin(ss.to)} の ${ss.to-ss.deadline}分前までに終わらせよう</p>`:''}
    <div class="mascot" style="margin-bottom:10px">${mascotSvg(type, ev.mood, 64)}<div class="bubble grow">${text}</div></div>
    <div class="row" style="justify-content:space-between;font-size:14px;margin-bottom:6px"><span>合計 <b>${w.need}分</b></span><span>締め切り <b>${w.dl}</b> まで <b>${Math.max(0,w.untilDl)}分</b></span></div>
    ${rs.map(r=>`<div class="routine"><div class="time">${r.start}</div><div class="grow"><b>${esc(r.title)}</b><div class="muted">${r.dur}分${r.kind==='dates'?'':'・毎週'}</div></div>${r.kind==='dates'?`<button class="small ghost" data-act="rmToday" data-id="${r.id}">×</button>`:'<span class="pill gray">毎週</span>'}</div>`).join('')||'<div class="empty">まだなにもないよ</div>'}
    <form data-form="todo" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">
      <label style="margin-top:0">やることを追加</label>
      <input name="title" required maxlength="30" placeholder="れい：宿題、ストレッチ、音読">
      ${recent.length?`<div class="chips" style="margin-top:8px">${recent.map(t=>`<button type="button" class="small soft" data-act="pickTitle" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}
      <div class="row"><div class="grow"><label>なん分？</label><div class="chips">${[10,20,30,45,60].map(n=>`<button type="button" class="small soft" data-act="setDur" data-n="${n}">${n}</button>`).join('')}</div><input type="number" name="dur" min="1" max="240" value="30" required style="margin-top:6px"></div>
      <div style="width:120px"><label>何時から？</label><input type="time" name="start" value="${nextFreeStart(kid)}"></div></div>
      <button class="soft" style="width:100%;margin-top:10px">＋ リストに追加</button>
      <button type="button" class="ghost small" style="width:100%;margin-top:8px" data-act="addRoutine">毎週の予定や、先の日の予定をいれる</button>
    </form>
    <button class="${ev.key==='planOver'?'warn':''}" style="width:100%;margin-top:14px;font-size:18px;padding:16px" data-act="confirmPlan">${rs.length?(ss.id==='am'?'これで朝の計画けってい！':'これで計画けってい！'):'やることなし（けってい）'}</button>
    <p class="muted" style="margin:8px 0 0">けっていすると、ゲーム・動画のタイマーが使えるようになるよ。${bonusPts(ss.id)>0?`<br>🎁 締め切り${fromMin(ss.deadline)}までに全部おわったら <b>+${bonusPts(ss.id)}pt</b>！`:''}</p>
  </div>`;

const MASCOTS = {
  kaiju:{name:'ガオン', desc:'かっこいい怪獣'},
  devil:{name:'ルルベル', desc:'小悪魔'},
  bunny:{name:'ミミ', desc:'うさぎ'},

const MASCOT_ORDER=['kaiju','devil','bunny'];
function mascotOf(kid){ const s=D().settings.mascot?.[kid]; if(s&&MASCOTS[s]) return s; const i=kids().findIndex(k=>k.id===kid); return MASCOT_ORDER[Math.max(0,i)%3] }
function mascotSvg(type, mood='normal', size=72){
  const ink='#2a2328';
  let body='';
  if(type==='kaiju'){
    body=`<path d="M22 40 L30 18 L38 34 L46 10 L54 30 L62 12 L70 34 L78 20 L80 44 Z" fill="#2c6b42"/>
      <ellipse cx="50" cy="60" rx="35" ry="32" fill="#4aa069"/>

      <ellipse cx="18" cy="70" rx="6" ry="9" fill="#4aa069"/><ellipse cx="82" cy="70" rx="6" ry="9" fill="#4aa069"/>`;
  } else if(type==='devil'){
    body=`<path d="M78 74 Q96 70 92 52 L98 50 L90 42 L86 52 Q88 64 76 66 Z" fill="#3b2d57"/>
      <path d="M24 34 L18 8 L40 26 Z" fill="#3b2d57"/><path d="M76 34 L82 8 L60 26 Z" fill="#3b2d57"/>
      <circle cx="50" cy="56" r="36" fill="#3b2d57"/>
      <ellipse cx="50" cy="62" rx="26" ry="23" fill="#fbf2f7"/>
      <circle cx="66" cy="27" r="6" fill="#ff7eb3"/><circle cx="74" cy="31" r="6" fill="#ff7eb3"/><circle cx="70" cy="30" r="3.5" fill="#ffc2da"/>`;
  } else {
    body=`<ellipse cx="36" cy="22" rx="9" ry="22" fill="#fff" stroke="#e8c9d4" stroke-width="2"/><ellipse cx="36" cy="24" rx="4.5" ry="15" fill="#ffc2d4"/>
      <ellipse cx="64" cy="22" rx="9" ry="22" fill="#fff" stroke="#e8c9d4" stroke-width="2"/><ellipse cx="64" cy="24" rx="4.5" ry="15" fill="#ffc2d4"/>
      <circle cx="50" cy="62" r="32" fill="#fff" stroke="#e8c9d4" stroke-width="2"/>`;
  }
  const ey=type==='devil'?58:56, my=type==='devil'?71:70;
  let eyes='', mouth='', extra='';
  if(mood==='happy'){
    eyes=`<path d="M36 ${ey+2} Q41 ${ey-5} 46 ${ey+2}" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M54 ${ey+2} Q59 ${ey-5} 64 ${ey+2}" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    mouth=`<path d="M41 ${my-2} Q50 ${my+10} 59 ${my-2} Z" fill="#c2384f"/>`;
  } else {
    eyes=`<circle cx="41" cy="${ey}" r="4.2" fill="${ink}"/><circle cx="59" cy="${ey}" r="4.2" fill="${ink}"/><circle cx="42.4" cy="${ey-1.4}" r="1.3" fill="#fff"/><circle cx="60.4" cy="${ey-1.4}" r="1.3" fill="#fff"/>`;
    if(mood==='normal') mouth=`<path d="M44 ${my} Q50 ${my+5} 56 ${my}" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    if(mood==='worry'){ mouth=`<path d="M43 ${my+2} Q46.5 ${my-1} 50 ${my+2} Q53.5 ${my+5} 57 ${my+2}" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`; extra=`<path d="M74 ${ey-14} Q79 ${ey-6} 74 ${ey-3} Q69 ${ey-6} 74 ${ey-14} Z" fill="#7cc4f2"/>` }
    if(mood==='angry'){ mouth=`<path d="M43 ${my+4} Q50 ${my-3} 57 ${my+4}" stroke="${ink}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`; extra=`<path d="M34 ${ey-10} L46 ${ey-6}" stroke="${ink}" stroke-width="3" stroke-linecap="round"/><path d="M66 ${ey-10} L54 ${ey-6}" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>` }
  }
  if(type==='kaiju' && (mood==='happy'||mood==='angry')) extra+=`<path d="M44 ${my-1} l3 4 l3 -4 Z M50 ${my-1} l3 4 l3 -4 Z" fill="#fff"/>`;

  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${body}${cheeks}${eyes}${mouth}${extra}</svg>`;

function pickLine(type, key, vars){
  const arr=(LINES[type]||LINES.bunny)[key]||['']; const seed=[...(key+today()+new Date().getHours())].reduce((a,c)=>a+c.charCodeAt(0),0);
  return arr[seed%arr.length].replace(/\{(\w+)\}/g,(_,k)=>esc(vars[k]??''));
}

/* いまの状況から、キャラが言うことを決める（上ほど優先） */
function bedMin(kid){ return toMin(D().settings.bedtime?.[kid] || '21:00') }
function deadlineBuf(){ return Number(D().settings.deadlineBuffer ?? 30) }
/* 1日を「朝（学校に出るまで）」と「放課後〜寝るまで」に分けて、それぞれに締め切りを持つ */
function departMin(kid){ const v=D().settings.depart?.[kid]; return v && !isWeekend() ? toMin(v) : null }
function session(kid){
  const dep=departMin(kid), n=nowMin();
  if(dep!=null && n<dep) return {id:'am', label:'朝', from:0, to:dep, deadline:dep-Number(D().settings.morningBuffer ?? 10), planKey:'plannedAM'};
  return {id:'pm', label:dep!=null?'放課後':'きょう', from:dep??0, to:24*60, deadline:bedMin(kid)-deadlineBuf(), planKey:'planned'};
}
function deadlineMin(kid){ return session(kid).deadline }
function isPlanned(kid){ return !!timer(kid)[session(kid).planKey] }
function sessionRoutines(kid){ const ss=session(kid); return todaysRoutines(kid).filter(r=>{ const m=toMin(r.start); return m>=ss.from && m<ss.to }) }
/* のこりのやることと、締め切りまでの時間 */
function workload(kid){
  const n=nowMin(), rs=sessionRoutines(kid), st=r=>routineState(r);
  const remain=rs.filter(r=>['todo','missed','running'].includes(st(r)));
  const need=remain.reduce((s,r)=>{ if(st(r)==='running'){ const l=logFor(r.id); return s+Math.max(5, r.dur-Math.floor((now()-l.startedAt)/60000)) } return s+r.dur },0);
  const dl=deadlineMin(kid);
  const am=session(kid).id==='am';
  return {rs, remain, need, untilDl: dl-n, dl:fromMin(dl), untilBed: am?9999:bedMin(kid)-n, am};
}
function planEval(kid){
  const w=workload(kid), v={m:w.need, u:Math.max(0,w.untilDl), d:w.dl};
  if(!w.rs.length) return {key:'planEmpty', mood:'normal', v};
  if(!w.remain.length) return {key:'allDone', mood:'happy', v};
  if(w.need>w.untilDl) return {key:'planOver', mood:'angry', v};
  if(w.need+20>w.untilDl) return {key:'planTight', mood:'worry', v};
  return {key:'planGood', mood:'happy', v};
}
function situation(kid){
  const n=nowMin(), {rs, remain, need, untilDl, dl, untilBed}=workload(kid);
  const st=r=>routineState(r);
  const running=rs.find(r=>st(r)==='running');
  const late=rs.find(r=>st(r)==='missed' || (st(r)==='todo' && n>toMin(r.start)+10));
  const nextR=rs.find(r=>st(r)==='todo');
  const t=timer(kid), tLeft=timerLeft(kid);
  const recent=D().points.filter(p=>p.member===kid && p.type!=='spend' && now()-p.at<3*3600e3).sort((a,b)=>b.at-a.at)[0];
  const doneRecent=D().logs.filter(l=>l.member===kid && l.date===today() && l.endedAt && now()-l.endedAt<15*60e3 && ['done','approved','review'].includes(l.state)).sort((a,b)=>b.endedAt-a.endedAt)[0];
  const title=r=>r?.title||'';
  const base={d:dl, u:Math.max(0,untilDl), m:need, n:remain.length};
  const S=(key,level,mood,vars={})=>({key, level, mood, vars:{...base, ...vars}});
  if(untilBed<=0 && remain.length) return S('impossible','strict','angry');
  if(untilBed<=0) return S('pastBed','info','normal');
  if(untilDl<=0 && remain.length) return S('overDeadline','strict','angry');
  if(!isPlanned(kid)) return S('notPlanned','warn','worry');
  if(remain.length && need>untilDl) return S('impossible','strict','angry');
  if(running){ const l=logFor(running.id); if((now()-l.startedAt)/60000 > running.dur*1.3+2) return S('slow:'+running.id,'warn','worry',{x:title(running)}) }
  if(late && !running) return S('late:'+late.id,'warn','worry',{x:title(late)});
  if(remain.length && need+15>untilDl) return S('tight','warn','worry',{x:untilDl});
  if(t.since && tLeft<5*60e3 && tLeft>0) return S('timerLow','warn','worry',{x:Math.ceil(tLeft/60e3)});
  if(recent && recent.amount<0) return S('deducted:'+recent.id,'info','worry',{x:-recent.amount});
  if(doneRecent) return S('justDone','good','happy',{x:title(D().routines.find(r=>r.id===doneRecent.routine))});
  if(recent) return S('points:'+recent.id,'good','happy',{x:recent.amount,msg:recent.msg});
  if(running) return S('running','info','normal',{x:title(running)});
  if(rs.length && !remain.length) return S('allDone','good','happy');
  if(tLeft<=0 && t.used>0) return S('timerOver','info','normal');
  if(nextR) return S('advice','info','normal',{t:title(nextR), e:fromMin(Math.max(n,0)+need)});
  return S('idle','info','normal');
}
function mascotSays(kid, s=situation(kid)){
  const type=mascotOf(kid), k=M(kid);
  return {type, mood:s.mood, level:s.level, key:s.key, text:pickLine(type, s.key.split(':')[0], {...s.vars, name:k?.name})};
}
function mascotCard(kid, compact){
  const m=mascotSays(kid), k=M(kid);
  const tone={strict:'var(--bad)',warn:'var(--warn)',good:'var(--good)',info:'var(--line)'}[m.level];
  return `<div class="card mascot" style="border:2px solid ${tone}">${mascotSvg(m.type,m.mood,compact?56:76)}<div class="grow">${compact?`<b>${esc(k.name)}</b> `:''}<span class="muted">${MASCOTS[m.type].name}</span><div class="bubble">${m.text}</div></div></div>`;
}

function openRoutineModal(edit, date){
  ui.rd = edit ? {kind:edit.kind==='dates'?'dates':'weekly', slots:Object.fromEntries((edit.slots||[]).filter(x=>x.date>=today()).map(x=>[x.date,x.start]))}
               : {kind:'dates', slots: date?{[date]:lastTime()}:{}};
  drafts={}; ui.modal=()=>modalRoutine(edit); render();
}
function lastTime(){ const ts=[...app.querySelectorAll('form[data-form="routine"] input[type=time]')].map(x=>x.value).filter(Boolean); return ts[ts.length-1] || ui.lastTime || '16:00' }
function syncSlotTimes(){ for(const ds of Object.keys(ui.rd.slots)){ const el=app.querySelector(`[name="t_${ds}"]`); if(el&&el.value) ui.rd.slots[ds]=el.value } }
function modalMyRoutines(){

  <p class="muted">直すと、もういちどおやの OK がひつようです。</p><button class="ghost" style="width:100%;margin-top:8px" data-act="closeModal">とじる</button>`;
}
function modalExcuse(rid){

/* ----- ポイント ----- */
function viewPoints(){
  const m=me(); let h='';
  if(m.role==='kid'){
    h+=`<div class="card" style="text-align:center"><div class="muted">使えるポイント</div><div class="points-big">${pointsTotal(m.id)}</div><button class="soft" data-act="tab" data-tab="timer">⏱ ゲーム時間に交換する（1pt＝1分）</button></div>`;
    h+=rankingCard();
    h+=`<div class="card"><h2>ありがとうの記録</h2>${histList(m.id)}</div>`;
  } else {
    h+=`<div class="card"><h2>ありがとうポイントをおくる</h2><p class="muted">助かったことを、ひとことと一緒に。</p>
      <div class="row" style="justify-content:space-around;margin-top:8px">${kids().map(k=>`<div style="text-align:center">${avatar(k,true)}<div><b>${k.name}</b></div><div class="pill">のこり ${pointsTotal(k.id)} pt</div></div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="grow" data-act="give">＋ ありがとう</button><button class="bad" data-act="deduct">− 減点</button></div></div>`;
    h+=rankingCard();
    h+=`<div class="card"><h2>最近の記録</h2>${histList(null)}</div>`;
  }
  return h;
}
function histList(member){
  const ps=D().points.filter(p=>!member||p.member===member).sort((a,b)=>b.at-a.at).slice(0,40);
  if(!ps.length) return '<div class="empty">まだありません</div>';
  return ps.map(p=>`<div class="hist row"><div class="amt ${p.amount>=0?'plus':'minus'}">${p.amount>0?'+':''}${p.amount}</div><div class="grow"><div>${esc(p.msg)}</div><div class="muted">${member?'':M(p.member).name+' ・ '}${p.from==='auto'?'アプリ':(M(p.from)?.name||'')}より ・ ${new Date(p.at).getMonth()+1}/${new Date(p.at).getDate()} ${hm(p.at)}</div></div></div>`).join('');
}
function modalGive(minus, preset){
  const p = preset||{};
  return `<h2>${minus?'減点する':'ありがとうポイント'}</h2><form data-form="points" data-minus="${minus?1:''}" data-log="${p.log||''}">
  <label>だれに？</label><div class="chips">${kids().map(k=>`<label style="margin:0"><input type="radio" name="member" value="${k.id}" ${p.member===k.id?'checked':''} required style="width:auto"> ${k.name}</label>`).join('')}</div>
  <label>ポイント（1点ずつ調整できます）</label>
  <div class="row" style="justify-content:center;gap:14px;margin:4px 0 10px">
    <button type="button" class="ghost" style="width:56px;height:56px;font-size:28px;padding:0" data-act="stepAmt" data-n="-1">−</button>
    <input name="amount" type="number" inputmode="numeric" min="1" max="100" step="1" value="${p.amount||5}" required style="width:110px;text-align:center;font-size:32px;font-weight:800">
    <button type="button" class="ghost" style="width:56px;height:56px;font-size:28px;padding:0" data-act="stepAmt" data-n="1">＋</button>
  </div>
  <div class="chips" style="justify-content:center">${[1,2,3,5,10,20].map(n=>`<button type="button" class="soft small" data-act="setAmt" data-n="${n}">${n}</button>`).join('')}</div>
  <label>${minus?'理由':'ひとこと'}</label><input name="msg" required maxlength="60" value="${esc(p.msg||'')}" placeholder="${minus?'れい：理由なく宿題をサボった':'れい：お皿洗いしてくれて助かった！'}">
  <div class="row" style="margin-top:16px"><button type="button" class="ghost" data-act="closeModal">やめる</button><button class="grow ${minus?'bad':''}">おくる</button></div></form>`;

/* ----- タイマー ----- */
function ring(kid, size){
  const limit=timerLimit(kid), left=timerLeft(kid), frac=limit?left/limit:0, R=size/2-14, C=2*Math.PI*R;
  const col = left<=0?'var(--bad)': left<5*60000?'var(--warn)':'var(--main)';
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>
  <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-text" fill="var(--ink)">${fmtDur(left)}</text></svg>`;
}
function viewTimer(){
  const m=me();
  if(m.role==='kid'){
    const t=timer(m.id), left=timerLeft(m.id);
    return `<div class="card" style="text-align:center"><h2>ゲーム・動画の のこり時間</h2>${ring(m.id,260)}
      <p class="muted">${allowanceReason(m.id)} ${allowanceToday(m.id)}分${t.bought?` ＋ポイント交換 ${t.bought}分`:''}${t.extra>0?` ＋おまけ ${t.extra}分`:t.extra<0?` −${-t.extra}分`:''} ・ つかった ${Math.floor(timerUsed(m.id)/60000)}分</p>
      ${(()=>{ const why=gameLockReason(m.id), ul=usableLeft(m.id);
        if(!why && isPlanned(m.id) && ul<left-60000) return `<p style="font-weight:700;color:var(--warn)">やることのために、いま使えるのは あと ${fmtDur(ul)} まで</p>`;
        if(why && isPlanned(m.id) && !gameClosed(m.id) && left>0) return `<p style="font-weight:700;color:var(--bad)">🔒 ${why}</p>`;
        return '' })()}
      <p class="muted" style="margin-top:-4px">ゲームは ${fromMin(cutoffMin(m.id))} まで</p>
      ${!isPlanned(m.id)?'<button class="soft" style="width:100%;font-size:18px;padding:16px" data-act="tab" data-tab="home">📝 まず、やることリストをけっていしよう</button>':gameClosed(m.id)?`<h2 style="color:var(--bad)">きょうのゲームは ${fromMin(cutoffMin(m.id))} でおしまい</h2>`:left<=0?'<h2 style="color:var(--bad)" class="alarm">きょうはおしまい！</h2>':(!t.since && gameSlack(m.id)<=0)?'<button class="soft" style="width:100%;font-size:18px;padding:16px" data-act="tab" data-tab="home">🔒 先にやることを終わらせよう</button>':
        t.since?'<button class="warn" style="width:100%;font-size:20px;padding:18px" data-act="pause">⏸ ちょっと休けい（一時停止）</button>':
        '<button style="width:100%;font-size:20px;padding:18px" data-act="play">▶ スタート</button>'}
      </div>
      <div class="card"><div class="row"><h3 class="grow" style="margin:0">⭐ ポイントでゲーム時間をふやす</h3><span class="pill">${pointsTotal(m.id)} pt</span></div>
        <p class="muted" style="margin:6px 0 10px">1ポイント ＝ 1分。使ったポイントはへるよ。</p>
        ${gameClosed(m.id)?'<div class="muted">きょうはもう交換できないよ</div>':isPlanned(m.id)?`<div class="chips">${[5,10,15,30].map(n=>`<button class="small ${pointsTotal(m.id)>=n?'':'soft'}" data-act="spend" data-n="${n}" ${pointsTotal(m.id)>=n?'':'disabled'}>+${n}分（${n}pt）</button>`).join('')}</div>`:'<div class="muted">やることリストをけっていすると使えるよ</div>'}
      </div>
      ${mascotCard(m.id)}<div class="card"><p class="muted">やめるときは「一時停止」を押すと、のこりがとっておけるよ。アプリを閉じても時間はとまらないので注意！</p></div>`;
  }
  return `<div class="card"><h2>みんなの のこり時間</h2>${kids().map(k=>{
    const t=timer(k.id), left=timerLeft(k.id), lim=timerLimit(k.id);
    return `<div class="kid-timer" style="padding:10px 0;border-top:1px solid var(--line)">${avatar(k)}<div class="grow"><div class="row"><b class="grow">${k.name}</b>${gameClosed(k.id)?'<span class="pill bad">終了</span>':t.since?'<span class="pill warn">つかってる</span>':left<=0?'<span class="pill bad">おしまい</span>':gameSlack(k.id)<=0?'<span class="pill bad">🔒やること優先</span>':'<span class="pill gray">とまってる</span>'}<b style="font-variant-numeric:tabular-nums;font-size:20px">${fmtDur(left)}</b></div>
      <div class="bar" style="margin:6px 0"><i style="width:${lim?left/lim*100:0}%;background:${k.color}"></i></div>
      <div class="muted" style="font-size:13px">おまけ：${t.extra>0?'+':''}${t.extra||0}分${t.bought?` ・ ポイント交換：+${t.bought}分`:''}</div>
      <div class="row wrapr" style="gap:6px;margin-top:4px"><button class="small soft" data-act="extend" data-id="${k.id}" data-n="-5">−5分</button><button class="small soft" data-act="extend" data-id="${k.id}" data-n="5">+5分</button><button class="small soft" data-act="extend" data-id="${k.id}" data-n="15">+15分</button><button class="small ghost" data-act="clearExtra" data-id="${k.id}" ${t.extra?'':'disabled'}>おまけを消す</button>${t.since?`<button class="small warn" data-act="pause" data-id="${k.id}">止める</button>`:''}</div></div></div>`}).join('')}
    </div><p class="muted">持ち時間は「おや」ページで変えられます。</p>`;
}

/* ----- おや ----- */
function viewParent(){
  const d=D(); let h='';
  const pr=d.routines.filter(r=>r.status==='pending');
  const rv=d.logs.filter(l=>l.state==='review'), ex=d.logs.filter(l=>l.state==='excuse');
  h+=`<div class="card"><h2>確認すること</h2>`;
  if(!pr.length&&!rv.length&&!ex.length) h+='<div class="empty">いまはありません 👍</div>';
  for(const r of pr) h+=`<div class="routine"><div class="grow"><b>${M(r.owner).name}：${esc(r.title)}</b><div class="muted">新しいルーチン ・ ${schedLabel(r)} ${r.dur}分</div></div><button class="small soft" data-act="rejRoutine" data-id="${r.id}">NG</button><button class="small" data-act="okRoutine" data-id="${r.id}">OK</button></div>`;
  for(const l of rv){ const r=d.routines.find(x=>x.id===l.routine); h+=`<div class="routine"><div class="grow"><b>${M(l.member).name}：${esc(r?.title)}</b><div class="muted">予定${r?.dur}分のところ ${Math.max(1,Math.round((l.endedAt-l.startedAt)/60000))}分で終了。本当にできた？</div></div><button class="small soft" data-act="redo" data-id="${l.id}">やり直し</button><button class="small" data-act="okLog" data-id="${l.id}">OK</button></div>` }
  for(const l of ex){ const r=d.routines.find(x=>x.id===l.routine); h+=`<div class="routine"><div class="grow"><b>${M(l.member).name}：${esc(r?.title)}</b><div class="muted">できなかった理由：「${esc(l.reason)}」</div></div><button class="small bad" data-act="skipLog" data-id="${l.id}">減点</button><button class="small" data-act="excuseOk" data-id="${l.id}">OK</button></div>` }
  h+='</div>';
  const missed=todaysRoutines().filter(r=>routineState(r)==='missed');
  if(missed.length) h+=`<div class="card"><h2>きょう、まだのルーチン</h2>${missed.map(r=>`<div class="routine"><div class="grow"><b>${M(r.owner).name}：${esc(r.title)}</b><div class="muted">${r.start}〜 理由はまだ届いていません</div></div><button class="small bad" data-act="skipRoutine" data-id="${r.id}">サボり減点</button></div>`).join('')}<p class="muted">まずは本人に声をかけて、理由を書いてもらうのがおすすめです。</p></div>`;
  h+=`<div class="card"><h2>みんなのルーチン</h2>${kids().map(k=>{const rs=d.routines.filter(r=>r.owner===k.id&&r.status==='approved');return `<h3 style="margin-top:12px">${k.name}</h3>${rs.map(r=>`<div class="routine"><div class="time">${r.kind==='dates'?'📅':r.start}</div><div class="grow">${esc(r.title)}<div class="muted">${schedLabel(r)}・${r.dur}分</div></div><button class="small soft" data-act="editRoutine" data-id="${r.id}">直す</button></div>`).join('')||'<div class="muted">なし</div>'}`}).join('')}</div>`;
  h+=`<div class="card"><h2>設定</h2><form data-form="settings">
    ${kids().map(k=>`<div class="kidset"><div class="row">${avatar(k)}<h3 class="grow" style="margin:0">${esc(k.name)}</h3><label style="margin:0;white-space:nowrap"><input type="checkbox" name="sm_${k.id}" ${d.settings.simple[k.id]?'checked':''} style="width:auto"> 大きい表示</label></div>
      <label>ゲーム時間（分）曜日ごと</label>
      <div class="dowgrid">${DOW.map((w,i)=>`<label class="${i===0||i===6?'we':''}"><span>${w}</span><input type="number" inputmode="numeric" name="ad_${k.id}_${i}" min="0" max="600" value="${allowanceDow(k.id,i)}"></label>`).join('')}</div>
      <label>特定の日だけ変える（テスト前、旅行など）</label>
      ${Object.entries(d.settings.allowanceDate?.[k.id]||{}).filter(([x])=>x>=today()).sort().map(([x,v])=>`<div class="row" style="padding:2px 0"><b class="grow">${mdLabel(x)}</b><span>${v}分</span><button type="button" class="small ghost" data-act="rmOverride" data-id="${k.id}" data-date="${x}">×</button></div>`).join('')}
      <div class="row"><input type="date" id="ovd_${k.id}" min="${today()}" class="grow"><input type="number" id="ovm_${k.id}" min="0" max="600" placeholder="分" style="width:80px"><button type="button" class="small soft" data-act="addOverride" data-id="${k.id}">追加</button></div>

    <label>🎁 締め切りまでにやることを全部終えたら、もらえるポイント（0で なし・自動）</label>
    <div class="row"><div class="grow"><label style="margin-top:0">朝</label><input type="number" name="bonusam" min="0" max="100" value="${bonusPts('am')}"></div><div class="grow"><label style="margin-top:0">夜</label><input type="number" name="bonus" min="0" max="100" value="${bonusPts('pm')}"></div></div>
    <div class="row"><div class="grow"><label>夜の締め切り：寝る何分前？</label><input type="number" name="dlbuf" min="0" max="180" value="${deadlineBuf()}"></div><div class="grow"><label>朝の締め切り：家を出る何分前？</label><input type="number" name="mbuf" min="0" max="60" value="${D().settings.morningBuffer ?? 10}"></div></div>
    <h3 style="margin-top:20px">写真</h3><p class="muted">アイコンにする写真をえらんでください（この家族の端末だけで見られます）。</p>
    ${members().map(m=>`<div class="row" style="padding:6px 0">${avatar(m)}<b class="grow">${esc(m.name)}</b><label class="soft small" style="margin:0;padding:8px 12px;border-radius:12px;background:var(--main-soft);color:var(--main);font-weight:700;cursor:pointer">写真をえらぶ<input type="file" accept="image/*" data-photo="${m.id}" style="display:none"></label>${m.photo?`<button type="button" class="ghost small" data-act="rmPhoto" data-id="${m.id}">はずす</button>`:''}</div>`).join('')}
    <div class="row">${members().filter(m=>m.role==='parent').map(m=>`<div class="grow"><label>${esc(m.name)}の新しいPIN</label><input name="pin_${m.id}" inputmode="numeric" maxlength="4" placeholder="変えるときだけ"></div>`).join('')}</div>
    <button style="width:100%;margin-top:16px">設定をほぞん</button>
    </form></div>
    ${d.joinCode?`<div class="card"><h2>家族の端末をふやす</h2><p class="muted">ほかのスマホでこのアプリを開き、「家族コードで参加」にこのコードを入れてください。</p><div style="font-size:30px;font-weight:800;letter-spacing:.15em;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums">${d.joinCode}</div></div>`:''}
    <div class="card"><span class="muted" style="float:right">${APP_VERSION}</span><button class="ghost small" data-act="reset">${Backend===LocalBackend?'データをすべて消す':'この端末を家族から外す'}</button></div>`;
  return h;
}

/* ---------- Actions ---------- */
function askConfirm(msg, fn){ ui.confirmFn=fn; ui.modal=()=>`<h2>${esc(msg)}</h2><div class="row" style="margin-top:16px"><button class="ghost grow" data-act="closeModal">やめる</button><button class="bad grow" data-act="confirmYes">はい</button></div>`; render() }
function notify(title, body){
  try{ if('Notification' in window && Notification.permission==='granted') new Notification(title,{body, icon:'icon-192.png'}) }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,150,300]) }catch(e){}
}
const actions = {
  pick(el){ const m=M(el.dataset.id); if(m.role==='parent'){ ui.pinFor=m.id; ui.pin=''; render() } else login(m.id) },
  async pin(el){ ui.pin+=el.dataset.n; if(ui.pin.length===4){ const ok=(await sha(ui.pin))===D().settings.pins[ui.pinFor]; if(ok) login(ui.pinFor); else { ui.pin=''; toast('PINがちがいます') } } else render() },
  pinBack(){ ui.pin=ui.pin.slice(0,-1); render() },
  pinCancel(){ ui.pinFor=null; ui.pin=''; render() },
  logout,
  tab(el){ ui.tab=el.dataset.tab; render(); if(ui.tab==='timer' && 'Notification' in window && Notification.permission==='default') try{Notification.requestPermission()}catch(e){} },
  closeModal(){ ui.modal=null; drafts={}; render() },
  addRoutine(el){ openRoutineModal(null, el.dataset.date) },
  rank(el){ ui.rankRange=el.dataset.r; render() },
  viewDate(el){ ui.viewDate=el.dataset.date; render() },
  setKind(el){ syncSlotTimes(); ui.rd.kind=el.dataset.k; render() },
  toggleDate(el){ syncSlotTimes(); const ds=el.dataset.date; if(ui.rd.slots[ds]) delete ui.rd.slots[ds]; else ui.rd.slots[ds]=lastTime(); delete drafts['routine|t_'+ds]; render() },
  addDate(){ const v=document.getElementById('moreDate')?.value; if(!v) return toast('日にちをえらんでね'); if(v<today()) return toast('きょうより前はえらべないよ'); syncSlotTimes(); ui.rd.slots[v]=ui.rd.slots[v]||lastTime(); render() },
  pickTitle(el){ const f=el.closest('form'); const i=f.querySelector('[name=title]'); i.value=el.dataset.t; drafts[f.dataset.form+'|title']=el.dataset.t },
  setDur(el){ const f=el.closest('form'); f.dur.value=el.dataset.n; drafts[f.dataset.form+'|dur']=el.dataset.n },
  rmToday(el){ const T=today(); Store.update(d=>{ const r=d.routines.find(x=>x.id===el.dataset.id); if(!r) return; r.slots=(r.slots||[]).filter(x=>x.date!==T); if(!r.slots.some(x=>x.date>=T)) d.routines=d.routines.filter(x=>x!==r) }) },
  confirmPlan(){ const k=me().id, ev=planEval(k), key=session(k).planKey;
    Store.update(d=>{ const t=d.timers[timerKey(k)]||(d.timers[timerKey(k)]={used:0,since:null,extra:0}); t[key]=true; t[key+'At']=now() });
    const type=mascotOf(k); showMascot({type, mood:ev.key==='planOver'?'worry':'happy', level:'good', text: ev.key==='planOver'? pickLine(type,'planOver',ev.v)+'<br>おうちの人にも見せてね。' : pickLine(type, ev.key==='planEmpty'?'idle':'planGood', ev.v)}) },
  myRoutines(){ ui.modal=modalMyRoutines; render() },
  editRoutine(el){ const r=D().routines.find(x=>x.id===el.dataset.id); openRoutineModal(r) },
  delRoutine(el){ const id=el.dataset.id; askConfirm('このルーチンをけしますか？', ()=>Store.update(d=>{ d.routines=d.routines.filter(r=>r.id!==id) })) },
  confirmYes(){ const fn=ui.confirmFn; ui.confirmFn=null; ui.modal=null; fn&&fn(); render() },
  start(el){ Store.update(d=>{ d.logs=d.logs.filter(l=>!(l.routine===el.dataset.id&&l.date===today())); d.logs.push({id:uid(),routine:el.dataset.id,member:me().id,date:today(),startedAt:now(),state:'running'}) }); toast('がんばって！') },
  finish(el){
    const l=logFor(el.dataset.id), r=D().routines.find(x=>x.id===el.dataset.id);
    Store.update(()=>{ l.endedAt=now(); const min=(l.endedAt-l.startedAt)/60000; l.state = min < Math.max(1, r.dur*0.4) ? 'review' : 'done' });
    checkBonus(me().id);
    if(l.state==='review') toast('おつかれさま！早かったので、おやが確認するね');
    else { const s=mascotSays(me().id); if(s.key==='justDone'||s.key==='allDone'){ const o=alertedSet(); o.keys.push(s.key+':'+l.id); try{localStorage.setItem('familyApp.alerted',JSON.stringify(o))}catch(e){} showMascot(s) } else toast('できた！おつかれさま 🎉') }
  },
  excuse(el){ ui.modal=()=>modalExcuse(el.dataset.id); render() },
  give(){ ui.modal=()=>modalGive(false); render() },
  deduct(){ ui.modal=()=>modalGive(true); render() },
  setAmt(el){ const f=el.closest('form'); f.amount.value=el.dataset.n; drafts[f.dataset.form+'|amount']=el.dataset.n },
  stepAmt(el){ const f=el.closest('form'); const v=Math.min(100, Math.max(1, (parseInt(f.amount.value,10)||0)+Number(el.dataset.n))); f.amount.value=v; drafts[f.dataset.form+'|amount']=String(v) },
  okRoutine(el){ Store.update(d=>{ d.routines.find(r=>r.id===el.dataset.id).status='approved' }) },
  rejRoutine(el){ Store.update(d=>{ d.routines=d.routines.filter(r=>r.id!==el.dataset.id) }); toast('本人と話して作り直してもらいましょう') },
  okLog(el){ Store.update(d=>{ d.logs.find(l=>l.id===el.dataset.id).state='approved' }) },
  redo(el){ Store.update(d=>{ d.logs=d.logs.filter(l=>l.id!==el.dataset.id) }); toast('「まだ」に戻しました') },
  excuseOk(el){ Store.update(d=>{ d.logs.find(l=>l.id===el.dataset.id).state='excused' }) },
  skipLog(el){ const l=D().logs.find(x=>x.id===el.dataset.id), r=D().routines.find(x=>x.id===l.routine); ui.modal=()=>modalGive(true,{member:l.member,amount:3,msg:`${r?.title||'ルーチン'}をサボった`,log:l.id}); render() },
  skipRoutine(el){ const r=D().routines.find(x=>x.id===el.dataset.id);
    const lid=uid(); Store.update(d=>{ d.logs.push({id:lid,routine:r.id,member:r.owner,date:today(),state:'excuse',reason:'（理由なし）'}) });
    ui.modal=()=>modalGive(true,{member:r.owner,amount:3,msg:`${r.title}をサボった`,log:lid}); render() },
  play(){ const k=me().id; if(!isPlanned(k)){ ui.tab='home'; render(); return toast('まず、きょうのやることリストをけっていしよう') }
    const why=gameLockReason(k); if(why) return toast(why);
    Store.update(d=>{ const t=d.timers[timerKey(k)]||(d.timers[timerKey(k)]={used:0,since:null,extra:0}); if(!t.since) t.since=now(); warned[k]=false }) },
  pause(el){ const k=el.dataset.id||me().id; Store.update(d=>{ const t=d.timers[timerKey(k)]; if(t&&t.since){ t.used+=now()-t.since; t.since=null } }) },
  spend(el){ const k=me().id, n=Number(el.dataset.n);
    if(gameClosed(k)) return toast('きょうのゲームはもうおしまいだよ');
    if(!isPlanned(k)) return toast('まず、やることリストをけっていしよう');
    if(pointsTotal(k)<n) return toast('ポイントがたりないよ');
    askConfirm(`${n}ポイントを使って、ゲーム時間を${n}分ふやす？`, ()=>{
      Store.update(d=>{ d.points.push({id:uid(), member:k, amount:-n, msg:`ゲーム時間 +${n}分に交換`, from:k, at:now(), type:'spend'});
        const t=d.timers[timerKey(k)]||(d.timers[timerKey(k)]={used:0,since:null,extra:0}); t.bought=(t.bought||0)+n; delete warned[k] });
      toast(`ゲーム時間が${n}分ふえたよ`) }) },
  addOverride(el){ const k=el.dataset.id, dt=document.getElementById('ovd_'+k)?.value, mn=document.getElementById('ovm_'+k)?.value;
    if(!dt||mn==='') return toast('日にちと分を入れてください'); if(dt<today()) return toast('きょうより前の日は選べません');
    Store.update(d=>{ const s=d.settings; s.allowanceDate=s.allowanceDate||{}; s.allowanceDate[k]=s.allowanceDate[k]||{}; s.allowanceDate[k][dt]=Number(mn);
      for(const x of Object.keys(s.allowanceDate[k])) if(x<today()) delete s.allowanceDate[k][x] }); toast(`${mdLabel(dt)}のゲーム時間を${mn}分にしました`) },
  rmOverride(el){ const k=el.dataset.id, dt=el.dataset.date; Store.update(d=>{ delete d.settings.allowanceDate?.[k]?.[dt] }) },
  clearExtra(el){ const k=el.dataset.id; askConfirm(`${M(k).name}のきょうのおまけ時間を取り消しますか？`, ()=>{ Store.update(d=>{ const t=d.timers[timerKey(k)]; if(t) t.extra=0 }); toast('おまけを取り消しました') }) },
  extend(el){ const k=el.dataset.id; Store.update(d=>{ const t=d.timers[timerKey(k)]||(d.timers[timerKey(k)]={used:0,since:null,extra:0}); t.extra=Math.max(-allowanceToday(k), (t.extra||0)+Number(el.dataset.n)) }); const n=Number(el.dataset.n); toast(`${M(k).name} ${n>0?'+':'−'}${Math.abs(n)}分`) },
  reset(){ askConfirm(Backend===LocalBackend?'すべてのデータを消して最初の状態に戻します。よろしいですか？':'この端末を家族から外します。もう一度つなぐには家族コードが必要です。', async ()=>{ logout(); await Backend.leave(); render() }) },
  rmPhoto(el){ Store.update(d=>{ const m=d.members.find(x=>x.id===el.dataset.id); if(m) delete m.photo }) },
  setupNew(){ ui.setup='new'; render() },
  setupJoin(){ ui.setup='join'; render() },
  setupBack(){ ui.setup=null; render() },
};
app.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.classList.contains('modal-bg') && e.target!==el) return; // モーダルの中身のクリックでは閉じない
  const fn=actions[el.dataset.act]; if(fn){ e.preventDefault(); fn(el) }
});
app.addEventListener('input', trackDraft);
app.addEventListener('submit', e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), kind=f.dataset.form;
  handleSubmit(f, fd, kind);
  if(!ui.modal || kind==='settings') for(const k of Object.keys(drafts)) if(k.startsWith(kind+'|')) delete drafts[k];
});
function handleSubmit(f, fd, kind){
  if(kind==='setup'){
    (async()=>{
      const pin=fd.get('pin'); if(!/^\d{4}$/.test(pin)) return toast('PINは4けたの数字にしてください');
      const ms=[]; let pi=0, ki=0;
      for(let i=0;i<7;i++){ const name=(fd.get('n'+i)||'').trim(); if(!name) continue; const role=fd.get('r'+i);
        const id=role==='parent'?'p'+(++pi):'k'+(++ki); ms.push({id,name,role,grade:(fd.get('g'+i)||'').trim(),color:COLORS[ms.length%COLORS.length],initial:[...name][0]}) }
      if(!ms.some(m=>m.role==='parent')||!ms.some(m=>m.role==='kid')) return toast('おやと子どもを1人以上入れてください');
      const h=await sha(pin), settings={pins:{},allowance:{},simple:{}};
      for(const m of ms){ if(m.role==='parent') settings.pins[m.id]=h; else { settings.allowance[m.id]=60; (settings.allowanceWeekend||(settings.allowanceWeekend={}))[m.id]=90; (settings.bedtime||(settings.bedtime={}))[m.id]='21:00' } }
      ui.error=null; Store.state='loading'; render();
      try{ await Backend.createFamily({...emptyData(), members:ms, settings}); ui.setup=null; Store.state='ready'; render() }
      catch(e){ console.error(e); Store.state='nofamily'; ui.error='つくれませんでした：'+e.message; render() }
    })();
  }
  if(kind==='join'){
    (async()=>{
      ui.error=null; Store.state='loading'; render();
      try{ await Backend.joinFamily(fd.get('code')); ui.setup=null }
      catch(e){ console.error(e); Store.state='nofamily'; ui.error=e.message.includes('見つかりません')?e.message:'参加できませんでした：'+e.message; render() }
    })();
  }
  if(kind==='todo'){
    const k=me().id, T=today(), start=fd.get('start')||nextFreeStart(k);
    for(const key of Object.keys(drafts)) if(key.startsWith('todo|')) delete drafts[key];
    Store.update(d=>{ d.routines.push({id:uid(), owner:k, title:fd.get('title').trim(), dur:Number(fd.get('dur'))||30, kind:'dates', days:[], start, slots:[{date:T,start}], status:'approved'}) });
    toast('リストに追加したよ');
  }
  if(kind==='routine'){
    const owner=isParent()?fd.get('owner'):me().id, base={title:fd.get('title').trim(), dur:Number(fd.get('dur')), owner};
    let v;
    if(ui.rd.kind==='dates'){
      syncSlotTimes(); const ds=Object.keys(ui.rd.slots).sort();
      if(!ds.length) return toast('日にちを1つ以上えらんでね')
      const ex=D().routines.find(r=>r.id===f.dataset.id);
      const past=(ex?.slots||[]).filter(x=>x.date<today() && x.date>=addDays(today(),-30));
      v={...base, kind:'dates', days:[], start:ui.rd.slots[ds[0]], slots:[...past, ...ds.map(d=>({date:d,start:fd.get('t_'+d)||ui.rd.slots[d]}))], status:'approved'};
      ui.lastTime=v.slots[v.slots.length-1].start;
    } else {
      const days=DOW.map((_,i)=>fd.get('d'+i)?i:-1).filter(i=>i>=0);
      if(!days.length) return toast('ようびを1つ以上えらんでね');
      v={...base, kind:'weekly', days, start:fd.get('start'), slots:[], status: isParent()?'approved':'pending'};
    }
    ui.modal=null;
    Store.update(d=>{ const ex=d.routines.find(r=>r.id===f.dataset.id); if(ex) Object.assign(ex,v); else d.routines.push({id:uid(),...v}) });
    toast(isParent()||v.kind==='dates'?'ほぞんしました':'おやに OK をおねがいしたよ');
  }
  if(kind==='excuse'){
    ui.modal=null; const rid=f.dataset.id;
    Store.update(d=>{ d.logs=d.logs.filter(l=>!(l.routine===rid&&l.date===today())); d.logs.push({id:uid(),routine:rid,member:me().id,date:today(),state:'excuse',reason:fd.get('reason').trim()}) });
    toast('おやにおくったよ');
  }
  if(kind==='points'){
    const member=fd.get('member'); if(!member) return toast('だれにおくるか選んでください');
    const amt=Math.round(Math.abs(Number(fd.get('amount'))))*(f.dataset.minus?-1:1);
    ui.modal=null;
    Store.update(d=>{ d.points.push({id:uid(),member,amount:amt,msg:fd.get('msg').trim(),from:me().id,at:now()}); if(f.dataset.log){ const l=d.logs.find(x=>x.id===f.dataset.log); if(l) l.state='skipped' } });
    toast(amt>0?`${M(member).name}に +${amt} ありがとう！`:`${M(member).name} ${amt}`);
  }
  if(kind==='settings'){
    (async()=>{
      const pins={};
      for(const m of members().filter(m=>m.role==='parent')){ const v=(fd.get('pin_'+m.id)||'').trim(); if(!v) continue; if(!/^\d{4}$/.test(v)) return toast('PINは4けたの数字にしてください'); pins[m.id]=await sha(v) }
      Store.update(d=>{ const s=d.settings; s.allowanceWeekend=s.allowanceWeekend||{}; s.bedtime=s.bedtime||{}; s.mascot=s.mascot||{};
        s.bonusPoints=Math.max(0, Number(fd.get('bonus'))||0); s.bonusPointsAM=Math.max(0, Number(fd.get('bonusam'))||0);
        s.deadlineBuffer=Math.max(0, Number(fd.get('dlbuf'))||0); s.morningBuffer=Math.max(0, Number(fd.get('mbuf'))||0); s.depart=s.depart||{};
        s.allowanceDow=s.allowanceDow||{};
        for(const k of kids()){ s.allowanceDow[k.id]=DOW.map((_,i)=>Math.max(0, Number(fd.get('ad_'+k.id+'_'+i))||0)); s.bedtime[k.id]=fd.get('bed_'+k.id)||'21:00'; s.depart[k.id]=fd.get('dep_'+k.id)||''; (s.gameCutoff=s.gameCutoff||{})[k.id]=fd.get('gc_'+k.id)||''; s.mascot[k.id]=fd.get('ms_'+k.id); s.simple[k.id]=!!fd.get('sm_'+k.id) }
        Object.assign(s.pins,pins) });
      toast('設定をほぞんしました');
    })();
  }
}

app.addEventListener('change', e=>{
  trackDraft(e);
  const id=e.target.dataset?.photo; if(!id || !e.target.files[0]) return;
  const img=new Image(), url=URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{ const S=160, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d'), m=Math.min(img.width,img.height);
    g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S); URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',0.8); Store.update(d=>{ const mm=d.members.find(x=>x.id===id); if(mm) mm.photo=data }); toast('写真を設定しました') };
  img.onerror=()=>toast('この写真は読みこめませんでした');
  img.src=url;
});

/* ---------- Tick: タイマーの自動停止と予告 ---------- */
const warned={}; let tickN=0;
setInterval(()=>{
  let changed=false;
  if(Store.state!=='ready') return;
  for(const k of kids()){
    const tt=Store.data.timers[timerKey(k.id)];
    // 決めた時刻になったら、その日のゲーム時間は終了（のこりはリセット）
    if(nowMin()>=cutoffMin(k.id) && (!tt || !tt.closed)){ const c=Store.data.timers[timerKey(k.id)]||(Store.data.timers[timerKey(k.id)]={used:0,since:null,extra:0}); const lost=Math.ceil(timerLeft(k.id)/60000); if(c.since){ c.used+=now()-c.since; c.since=null } c.closed=true; c.forfeit=lost; changed=true; if(lost>0) notify(`${k.name}：きょうのゲームはおしまい`, `のこり${lost}分はリセットされました`); continue }
    const t=tt; if(!t||!t.since) continue;
    if(gameSlack(k.id)<=0){ t.used+=now()-t.since; t.since=null; changed=true; notify(`${k.name}：ゲームをいったんストップ`, 'このままだとやることが締め切りに間に合わないよ'); if(me()?.id===k.id){ const type=mascotOf(k.id); setTimeout(()=>showMascot({type, mood:'angry', level:'strict', text:pickLine(type,'gameLock',{d:fromMin(deadlineMin(k.id))})}),50) } continue }
    const left=timerLeft(k.id);
    if(left<=0){ t.used=timerLimit(k.id); t.since=null; changed=true; notify(`${k.name}：きょうの時間はおしまい`, 'おつかれさま！'); }
    else if(left<5*60000 && !warned[k.id]){ warned[k.id]=true; notify(`${k.name}：のこり5分`, 'そろそろ区切りをつけよう'); }
  }
  if(changed) Store.update(()=>{});
  if(Backend===FireBackend && FireBackend.fid && FireBackend.day!==today()) FireBackend.listen();
  if(me() && (ui.tab==='timer'||ui.tab==='home') && !ui.modal){ render.soft=true; render(); render.soft=false }
  if(++tickN%5===0){ for(const k of kids()) checkBonus(k.id); checkMascotAlert() }
},1000);

const APP_VERSION='v12';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ r.update(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) r.update() }) }).catch(()=>{});
Backend.start().catch(e=>{ console.error(e); Store.state='nofamily'; ui.error='サーバーにつながりませんでした：'+e.message; render() });
render();
</script>
