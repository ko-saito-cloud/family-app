<title>家族アプリ</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#22302c; --sub:#6b7773; --line:#e4e0d6;
  --main:#2f7d6d; --main-soft:#dcefe9; --warn:#d9822b; --bad:#c8453c; --good:#3a9a5b;
  --c-dad:#3b6fb6; --c-mom:#c0558f; --c-ryuta:#2f8f5b; --c-akari:#e08a1e; --c-shiori:#8a5cc7;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141a18; --card:#1e2624; --ink:#e8eeec; --sub:#9aa7a3; --line:#2e3936; --main:#5fbfa8; --main-soft:#23403a; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#141a18; --card:#1e2624; --ink:#e8eeec; --sub:#9aa7a3; --line:#2e3936; --main:#5fbfa8; --main-soft:#23403a; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:12px 16px;background:var(--main);color:#fff;font-weight:700}
button.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
button.soft{background:var(--main-soft);color:var(--main)}
button.bad{background:var(--bad)} button.warn{background:var(--warn)} button.small{padding:8px 12px;font-size:14px}
button:disabled{opacity:.4}
input,select,textarea{font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
.wrap{max-width:640px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

header.top .date{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;align-items:center;gap:10px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}

.badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.login{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}

.dots{display:flex;justify-content:center;gap:14px;margin:12px}

.routine:first-of-type{border-top:none}

.tl{position:relative;padding-left:8px}

.now-line:after{content:"";flex:1;height:2px;background:var(--bad)}
.points-big{font-size:56px;font-weight:800;text-align:center;line-height:1;margin:8px 0}
.hist{padding:10px 0;border-top:1px solid var(--line)}

.amt.plus{color:var(--good)} .amt.minus{color:var(--bad)}
.ring{display:block;margin:0 auto}

.kid-timer{display:flex;align-items:center;gap:12px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--main)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.empty{text-align:center;color:var(--sub);padding:18px 0}
.mascot{display:flex;gap:12px;align-items:center}
.mpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chatroom{padding:10px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.chatlog{max-height:calc(100vh - 330px);min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.chatday{text-align:center;font-size:12px;color:var(--sub);margin:6px 0}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:88%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:30px;height:30px;font-size:13px;flex:none}
.mbody{display:flex;flex-direction:column;min-width:0}.msg.me .mbody{align-items:flex-end}
.mname{font-size:11px;color:var(--sub);margin:0 0 2px 4px}

.msg.me .mb{background:var(--main);color:#fff;border-color:var(--main);border-radius:16px 16px 4px 16px}
.rd{color:var(--main);font-weight:700}.stk{padding:2px}.mtime{font-size:10px;color:var(--sub);margin:2px 4px 0}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.stamps button{padding:4px 6px;min-width:52px}
.chorepick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.chorepick .mp{padding:8px 2px}
.mp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--card,#fff);color:inherit;border:2px solid var(--line);border-radius:14px}
.mp span{font-size:11px;opacity:.7;font-weight:400}.mp.on{border-color:var(--main);background:var(--main-soft)}
.bubble{background:var(--main-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin-top:4px;font-weight:600;line-height:1.5}
.bubble.big{font-size:18px;margin-top:12px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.kidset{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.datechips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.datechip{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:17px;border-radius:12px}
.datechip small{font-size:11px;color:var(--sub);font-weight:600}
.datechip.we small{color:var(--bad)}
.datechip.on{background:var(--main);border-color:var(--main);color:#fff}.datechip.on small{color:#fff}
.dowgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dowgrid label{margin:0;text-align:center;font-weight:700;color:var(--ink)}
.dowgrid label.we span{color:var(--bad)}
.dowgrid input{padding:8px 2px;text-align:center;margin-top:2px}
.actual{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.big-mode{font-size:19px}
.big-mode button{padding:16px 20px}
.alarm{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   家族アプリ
   - config.js に Firebase の設定があれば、家族の端末どうしで同期
   - なければ、この端末だけに保存する「お試しモード」
   家族の名前などはすべてデータ側に保存し、コードには入れない
   ========================================================= */

const DOW = ['日','月','火','水','木','金','土'];
const COLORS = ['#3b6fb6','#c0558f','#2f8f5b','#e08a1e','#8a5cc7','#1f8fa8','#b5523b'];
const members = () => Store.data?.members || [];
const kids = () => members().filter(m=>m.role==='kid');
const M = id => members().find(m=>m.id===id);
const COLLS = ['routines','logs','points','timers'];

/* ---------- サーバー時刻（端末の時計をずらしてもズレない） ---------- */
let clockOffset = 0;
function now(){ return Date.now() + clockOffset }

async function sha(s){
  try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('family-app:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('') }
  catch(e){ return 'plain:'+s }
}
function clone(x){ return JSON.parse(JSON.stringify(x ?? null)) }
function emptyData(){ return {members:[], settings:{pins:{},allowance:{},simple:{}}, joinCode:null, routines:[], logs:[], points:[], deeds:[], chats:[], reads:[], timers:{}} }

/* ---------- 保存先：この端末だけ ---------- */
const LocalBackend = {
  KEY:'familyApp.local.v1',
  async start(){
    let d=null; try{ d=JSON.parse(localStorage.getItem(this.KEY)) }catch(e){}
    Store.data = d || null; Store.state = d ? 'ready' : 'nofamily'; render();
    window.addEventListener('storage', e=>{ if(e.key===this.KEY){ try{ Store.data=JSON.parse(e.newValue) }catch(_){} render() } });
  },
  async createFamily(data){ Store.data=data; this.write(); Store.state='ready' },
  async joinFamily(){ throw new Error('お試しモードでは家族コードは使えません') },
  write(){ try{ localStorage.setItem(this.KEY, JSON.stringify(Store.data)) }catch(e){} },
  async leave(){ try{ localStorage.removeItem(this.KEY) }catch(e){} Store.data=null; Store.state='nofamily' },
};

/* ---------- 保存先：Firebase（家族で同期） ---------- */
const FireBackend = {
  db:null, uid:null, fid:null, unsubs:[], day:null,
  async start(){
    firebase.initializeApp(window.FIREBASE_CONFIG);
    this.db = firebase.firestore();
    if(window.FIREBASE_EMULATOR){ firebase.auth().useEmulator('http://127.0.0.1:9099'); this.db.useEmulator('127.0.0.1', 8080) } // 開発用
    try{ await this.db.enablePersistence({synchronizeTabs:true}) }catch(e){}
    const cred = await firebase.auth().signInAnonymously();
    this.uid = cred.user.uid;
    let fid=null; try{ fid=localStorage.getItem('familyApp.fid') }catch(e){}
    if(fid){ try{ await this.attach(fid); return }catch(e){ console.warn(e) } }
    Store.state='nofamily'; render();
  },
  fam(){ return this.db.collection('families').doc(this.fid) },
  async attach(fid){
    this.fid=fid;
    const dev=this.fam().collection('devices').doc(this.uid);
    await dev.set({seen: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    try{ const s=await dev.get({source:'server'}); const t=s.data().seen?.toMillis(); if(t) clockOffset = t - Date.now() }catch(e){}
    try{ localStorage.setItem('familyApp.fid', fid) }catch(e){}
    Store.data = Store.data || emptyData();
    this.listen();
  },
  listen(){
    this.unsubs.forEach(u=>u()); this.unsubs=[];
    this.day = today();
    const since = today(new Date(Date.now()-14*864e5));
    const f=this.fam(), d=()=>Store.data;
    let first=true;
    this.unsubs.push(f.onSnapshot(s=>{
      if(!s.exists){ return }
      const v=s.data(); d().members=v.members||[]; d().settings=v.settings||{pins:{},allowance:{},simple:{}}; d().joinCode=v.joinCode||null;
      if(first){ first=false; Store.state='ready' } render();
    }, err=>{ console.warn(err); this.fail() }));
    const coll=(name, q)=> this.unsubs.push(q.onSnapshot(s=>{
      if(name==='timers'){ const o={}; s.forEach(x=>o[x.id]=x.data()); d().timers=o }
      else if(name==='logs'){ const all=s.docs.map(x=>({id:x.id, ...x.data()})); d().logs=all.filter(x=>!x.deed&&!x.chat&&!x.chatRead); d().deeds=all.filter(x=>x.deed); d().chats=all.filter(x=>x.chat); d().reads=all.filter(x=>x.chatRead) }
      else d()[name]=s.docs.map(x=>({id:x.id, ...x.data()}));
      render();
    }, err=>console.warn(name, err)));
    coll('routines', f.collection('routines'));
    coll('logs', f.collection('logs').where('date','>=',since));
    coll('points', f.collection('points'));
    coll('timers', f.collection('timers').where('date','>=',today(new Date(Date.now()-8*864e5))));
  },
  fail(){ try{ localStorage.removeItem('familyApp.fid') }catch(e){} this.unsubs.forEach(u=>u()); this.unsubs=[]; Store.data=null; Store.state='nofamily'; render() },
  async createFamily(data){
    const ref=this.db.collection('families').doc();
    const code=joinCodeGen();
    await ref.set({owner:this.uid, members:data.members, settings:data.settings, joinCode:code, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    this.fid=ref.id;
    await ref.collection('devices').doc(this.uid).set({seen: firebase.firestore.FieldValue.serverTimestamp()});
    await this.db.collection('joinCodes').doc(code).set({fid:ref.id});
    Store.data=emptyData();
    await this.attach(ref.id);
  },
  async joinFamily(code){
    code=code.trim().toUpperCase();
    const j=await this.db.collection('joinCodes').doc(code).get();
    if(!j.exists) throw new Error('家族コードが見つかりません');
    const fid=j.data().fid;
    await this.db.collection('families').doc(fid).collection('devices').doc(this.uid).set({code, seen: firebase.firestore.FieldValue.serverTimestamp()});
    Store.data=emptyData();
    await this.attach(fid);
  },
  write(before, after){
    const f=this.fam(), batch=this.db.batch(); let n=0;
    if(JSON.stringify([before.members,before.settings])!==JSON.stringify([after.members,after.settings])){ batch.update(f,{members:clone(after.members), settings:clone(after.settings)}); n++ }
    for(const c of ['routines','logs','points','deeds','chats','reads']){
      const col=['deeds','chats','reads'].includes(c)?'logs':c; // お手伝い記録は logs に deed:true で保存（ルールの変更不要）
      const b=new Map((before[c]||[]).map(x=>[x.id,JSON.stringify(x)])), a=new Map((after[c]||[]).map(x=>[x.id,x]));
      for(const [id,x] of a){ if(b.get(id)!==JSON.stringify(x)){ const {id:_,...rest}=x; batch.set(f.collection(col).doc(id), clone(c==='deeds'?{...rest,deed:true}:c==='chats'?{...rest,chat:true}:c==='reads'?{...rest,chatRead:true}:rest)); n++ } }
      for(const id of b.keys()) if(!a.has(id)){ batch.delete(f.collection(col).doc(id)); n++ }
    }
    for(const [k,t] of Object.entries(after.timers)){ if(JSON.stringify(before.timers[k])!==JSON.stringify(t)){ batch.set(f.collection('timers').doc(k), clone({...t, date:k.split('|')[1]})); n++ } }
    if(n) batch.commit().catch(e=>{ console.warn(e); toast('保存できませんでした。通信を確認してください') });
  },
  async leave(){ try{ await this.fam().collection('devices').doc(this.uid).delete() }catch(e){} this.fail() },
};
function joinCodeGen(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const r=crypto.getRandomValues(new Uint32Array(8)); for(const x of r) s+=A[x%A.length]; return s }

const Backend = window.FIREBASE_CONFIG ? FireBackend : LocalBackend;
const Store = {
  data:null, state:'loading',
  update(fn){
    const before=clone(this.data); fn(this.data);
    if(Backend===LocalBackend) LocalBackend.write(); else FireBackend.write(before, this.data);
    render();
  },
};

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36) }

function today(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function hm(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') }
function toMin(s){ const [h,m]=s.split(':').map(Number); return h*60+m }
function fromMin(n){ return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0') }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes() }
function fmtDur(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0') }
function dateLabel(){ const d=new Date(); return (d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）' }

/* ---------- Domain ---------- */
const D = () => Store.data;
/* 予定には2種類：毎週（曜日）と、日にち指定（日ごとに時間を変えられる） */
function dateOf(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) }
function addDays(s,n){ const d=dateOf(s); d.setDate(d.getDate()+n); return today(d) }
function mdLabel(s){ const d=dateOf(s); const rel={[today()]:'きょう',[addDays(today(),1)]:'あした'}[s]; return rel || `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）` }
function routinesOn(date, member){
  const dow=dateOf(date).getDay(), out=[];
  for(const r of D().routines){
    if(r.status!=='approved' || (member && r.owner!==member)) continue;
    if(r.kind==='dates'){ const sl=(r.slots||[]).find(x=>x.date===date); if(sl) out.push({...r, start:sl.start}) }
    else if((r.days||[]).includes(dow)) out.push(r);
  }
  return out.sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function todaysRoutines(member){ return routinesOn(today(), member) }
function schedLabel(r){
  if(r.kind!=='dates') return `毎週 ${(r.days||[]).map(i=>DOW[i]).join('')} ${r.start}〜`;
  const up=(r.slots||[]).filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));
  if(!up.length) return '予定は終わりました';
  return up.slice(0,4).map(x=>`${mdLabel(x.date)} ${x.start}`).join('、')+(up.length>4?` ほか${up.length-4}日`:'');
}
function logFor(rid, date=today()){ return D().logs.find(l=>l.routine===rid && l.date===date) }
function routineState(r, date=today()){
  const l = logFor(r.id, date);
  if(l) return l.state;
  if(date<today()) return 'missed';
  if(date===today() && nowMin() > toMin(r.start)+r.dur+30) return 'missed';

  if(gameClosed(kid)) return 0;

  return Math.max(0, Math.min(timerLeft(kid), gameSlack(kid), untilCut));
}

  if(timerLeft(kid)<=0) return 'きょうの持ち時間はおしまい';

/* ---------- 締め切りまでに全部おわったらプレゼントポイント ---------- */

/* 朝（家を出るまで）と夜（寝るまで）それぞれで判定 */
function bonusWindows(kid){
  const st=D().settings, dep=departMin(kid), out=[];
  if(dep!=null) out.push({which:'am', from:0, to:dep, deadline:dep-Number(st.morningBuffer ?? 10), planKey:'plannedAM', msg:'🎁 朝の締め切りまでにぜんぶ完了ボーナス'});
  out.push({which:'pm', from:dep??0, to:24*60, deadline:bedMin(kid)-deadlineBuf(), planKey:'planned', msg:'🎁 夜の締め切りまでにぜんぶ完了ボーナス'});
  return out;
}
function checkBonus(kid){
  const T=today();
  for(const w of bonusWindows(kid)){
    const pts=bonusPts(w.which), id=`bonus-${w.which}-${kid}-${T}`;
    const has=D().points.some(p=>p.id===id);
    const rs=todaysRoutines(kid).filter(r=>{ const m=toMin(r.start); return m>=w.from && m<w.to });
    const dl=dateOf(T).getTime()+w.deadline*60000;
    const ok=rs.length>0 && rs.every(r=>{ const l=logFor(r.id,T); if(!l) return false; if(l.state==='excused') return true; return ['done','approved','review'].includes(l.state) && l.endedAt && l.endedAt<=dl });
    // ボーナスをもらったあとに、やることが追加された（＝まだ終わっていないものがある）→ ボーナスを取り消す
    if(has && !ok){
      Store.update(d=>{ d.points=d.points.filter(p=>p.id!==id) });
      if(me()?.id===kid) toast(`やることが追加されたので、ボーナスはいったん取り消し。締め切りまでに全部おわればまたもらえるよ`);
      continue;
    }
    if(has || pts<=0 || !rs.length || !timer(kid)[w.planKey] || !ok) continue;
    // 同じIDで保存するので、ほかの端末と同時に判定しても1回だけ
    Store.update(d=>{ if(!d.points.some(p=>p.id===id)) d.points.push({id, member:kid, amount:pts, msg:w.msg, from:'auto', at:now(), type:'bonus'}) });
  }
}

/* ---------- 親向け：スケジュールの実績 ---------- */
function deadlineFor(kid, date, startMin){
  const st=D().settings, d=dateOf(date), we=d.getDay()===0||d.getDay()===6, dep=st.depart?.[kid] && !we ? toMin(st.depart[kid]) : null;
  if(dep!=null && startMin<dep) return {min:dep-Number(st.morningBuffer ?? 10), label:'朝'};
  return {min:bedMin(kid)-deadlineBuf(), label:'夜'};
}
function actualRows(kid, date){
  const rs=routinesOn(date, kid), seen=new Set(rs.map(r=>r.id));
  // 予定を消したあとでも、記録が残っていれば表示する
  for(const l of D().logs) if(l.member===kid && l.date===date && !seen.has(l.routine)){ const r=D().routines.find(x=>x.id===l.routine); rs.push({id:l.routine, title:r?.title||'（けした予定）', start:l.startedAt?hm(l.startedAt):'--:--', dur:r?.dur||0, removed:true}) }
  const base=dateOf(date).getTime();
  return rs.sort((a,b)=>a.start.localeCompare(b.start)).map(r=>{
    const l=logFor(r.id,date), st=routineState(r,date), sm=toMin(r.start)||0, dl=deadlineFor(kid,date,sm);
    const flags=[];
    if(l?.startedAt){ const late=Math.round((l.startedAt-(base+sm*60000))/60000); if(late>10) flags.push(['開始 '+late+'分おくれ','warn']) }
    if(l?.endedAt){ const act=Math.max(1,Math.round((l.endedAt-l.startedAt)/60000)); if(r.dur && act<r.dur*0.4) flags.push(['予定より早すぎ','warn']); if(r.dur && act>r.dur*1.3) flags.push([`${act-r.dur}分オーバー`,'warn']); if(l.endedAt>base+dl.min*60000) flags.push([dl.label+'の締め切り後','bad']) }
    return {r, l, st, flags};
  });
}

function pickLine(type, key, vars){
  const arr=(LINES[type]||LINES.bunny)[key]||['']; const seed=[...(key+today()+new Date().getHours())].reduce((a,c)=>a+c.charCodeAt(0),0);
  return arr[seed%arr.length].replace(/\{(\w+)\}/g,(_,k)=>esc(vars[k]??''));
}

/* いまの状況から、キャラが言うことを決める（上ほど優先） */
function bedMin(kid){ return toMin(D().settings.bedtime?.[kid] || '21:00') }
function deadlineBuf(){ return Number(D().settings.deadlineBuffer ?? 30) }
/* 1日を「朝（学校に出るまで）」と「放課後〜寝るまで」に分けて、それぞれに締め切りを持つ */
function departMin(kid){ const v=D().settings.depart?.[kid]; return v && !isWeekend() ? toMin(v) : null }
function session(kid){
  const dep=departMin(kid), n=nowMin();
  if(dep!=null && n<dep) return {id:'am', label:'朝', from:0, to:dep, deadline:dep-Number(D().settings.morningBuffer ?? 10), planKey:'plannedAM'};
  return {id:'pm', label:dep!=null?'放課後':'きょう', from:dep??0, to:24*60, deadline:bedMin(kid)-deadlineBuf(), planKey:'planned'};
}
function deadlineMin(kid){ return session(kid).deadline }
function isPlanned(kid){ return !!timer(kid)[session(kid).planKey] }
function sessionRoutines(kid){ const ss=session(kid); return todaysRoutines(kid).filter(r=>{ const m=toMin(r.start); return m>=ss.from && m<ss.to }) }
/* のこりのやることと、締め切りまでの時間 */
function workload(kid){
  const n=nowMin(), rs=sessionRoutines(kid), st=r=>routineState(r);
  const remain=rs.filter(r=>['todo','missed','running'].includes(st(r)));
  const need=remain.reduce((s,r)=>{ if(st(r)==='running'){ const l=logFor(r.id); return s+Math.max(5, r.dur-Math.floor((now()-l.startedAt)/60000)) } return s+r.dur },0);
  const dl=deadlineMin(kid);
  const am=session(kid).id==='am';
  return {rs, remain, need, untilDl: dl-n, dl:fromMin(dl), untilBed: am?9999:bedMin(kid)-n, am};
}
function planEval(kid){
  const w=workload(kid), v={m:w.need, u:Math.max(0,w.untilDl), d:w.dl};
  if(!w.rs.length) return {key:'planEmpty', mood:'normal', v};
  if(!w.remain.length) return {key:'allDone', mood:'happy', v};
  if(w.need>w.untilDl) return {key:'planOver', mood:'angry', v};
  if(w.need+20>w.untilDl) return {key:'planTight', mood:'worry', v};
  return {key:'planGood', mood:'happy', v};
}
function situation(kid){
  const n=nowMin(), {rs, remain, need, untilDl, dl, untilBed}=workload(kid);
  const st=r=>routineState(r);
  const running=rs.find(r=>st(r)==='running');
  const late=rs.find(r=>st(r)==='missed' || (st(r)==='todo' && n>toMin(r.start)+10));
  const nextR=rs.find(r=>st(r)==='todo');
  const t=timer(kid), tLeft=timerLeft(kid);
  const recent=D().points.filter(p=>p.member===kid && p.type!=='spend' && now()-p.at<3*3600e3).sort((a,b)=>b.at-a.at)[0];
  const doneRecent=D().logs.filter(l=>l.member===kid && l.date===today() && l.endedAt && now()-l.endedAt<15*60e3 && ['done','approved','review'].includes(l.state)).sort((a,b)=>b.endedAt-a.endedAt)[0];
  const title=r=>r?.title||'';
  const base={d:dl, u:Math.max(0,untilDl), m:need, n:remain.length};
  const S=(key,level,mood,vars={})=>({key, level, mood, vars:{...base, ...vars}});
  if(untilBed<=0 && remain.length) return S('impossible','strict','angry');
  if(untilBed<=0) return S('pastBed','info','normal');
  if(untilDl<=0 && remain.length) return S('overDeadline','strict','angry');
  if(!isPlanned(kid)) return S('notPlanned','warn','worry');
  if(remain.length && need>untilDl) return S('impossible','strict','angry');
  if(running){ const l=logFor(running.id); if((now()-l.startedAt)/60000 > running.dur*1.3+2) return S('slow:'+running.id,'warn','worry',{x:title(running)}) }
  if(late && !running) return S('late:'+late.id,'warn','worry',{x:title(late)});
  if(remain.length && need+15>untilDl) return S('tight','warn','worry',{x:untilDl});
  if(t.since && tLeft<5*60e3 && tLeft>0) return S('timerLow','warn','worry',{x:Math.ceil(tLeft/60e3)});
  if(recent && recent.amount<0) return S('deducted:'+recent.id,'info','worry',{x:-recent.amount});
  if(doneRecent) return S('justDone','good','happy',{x:title(D().routines.find(r=>r.id===doneRecent.routine))});
  if(recent) return S('points:'+recent.id,'good','happy',{x:recent.amount,msg:recent.msg});
  if(running) return S('running','info','normal',{x:title(running)});
  if(rs.length && !remain.length) return S('allDone','good','happy');
  if(tLeft<=0 && t.used>0) return S('timerOver','info','normal');
  if(nextR) return S('advice','info','normal',{t:title(nextR), e:fromMin(Math.max(n,0)+need)});
  return S('idle','info','normal');
}

const app = document.getElementById('app');
let drafts = {};
function trackDraft(e){ const el=e.target, f=el.form?.dataset?.form; if(!f||!el.name||el.type==='file') return; drafts[f+'|'+el.name]= el.type==='checkbox'?el.checked:el.value }
function render(){
  if(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && render.soft) return;
  const ae=document.activeElement, keep=ae&&ae.form&&ae.name?{f:ae.form.dataset.form,n:ae.name,s:ae.selectionStart,e:ae.selectionEnd}:null;
  let html;
  if(Store.state==='loading') html = '<div class="wrap"><div class="empty" style="margin-top:40vh">よみこみ中…</div></div>';
  else if(Store.state==='nofamily') html = viewSetup();
  else if(!me()) html = ui.pinFor ? viewPin() : viewLogin();
  else html = viewHeader() + '<div class="wrap">' + ({home:viewHome, help:viewHelp, chat:viewChat, points:viewPoints, timer:viewTimer, parent:viewParent}[ui.tab]||viewHome)() + '</div>' + viewTabs();
  if(ui.modal) html += '<div class="modal-bg" data-act="closeModal"><div class="modal">'+ui.modal()+'</div></div>';
  if(ui.toast) html += '<div class="toast">'+esc(ui.toast)+'</div>';
  app.innerHTML = html;
  // 同期で画面が描き直されても、入力中の内容は消さない
  for(const [k,v] of Object.entries(drafts)){ const [f,n]=k.split('|'); const el=app.querySelector(`form[data-form="${f}"] [name="${n}"]`); if(!el) continue; if(el.type==='checkbox'||el.type==='radio'){ if(el.type==='radio') { const r=app.querySelector(`form[data-form="${f}"] [name="${n}"][value="${v}"]`); if(r) r.checked=true } else el.checked=v } else el.value=v }
  document.body.classList.toggle('big-mode', !!(me() && D().settings.simple?.[me().id]));
  if(keep && !ui.modal){ const el=app.querySelector(`form[data-form="${keep.f}"] [name="${keep.n}"]`); if(el){ try{ el.focus({preventScroll:true}); if(keep.s!=null) el.setSelectionRange(keep.s,keep.e) }catch(e){} } }
  if(me() && ui.tab==='chat' && ui.room){ const lg=app.querySelector('.chatlog'); if(lg) lg.scrollTop=lg.scrollHeight; if(document.visibilityState==='visible') markRead(me().id, ui.room) }
}

function viewTimeline(date=today()){
  const rs=routinesOn(date), isToday=date===today();

  const n=nowMin(); let placed=!isToday, h='<div class="tl">';

    const o=M(r.owner), [lab,cls]=STATE_LABEL[routineState(r,date)];
    h+=`<div class="tl-item"><div class="tl-bar" style="background:${o.color}"></div><div class="time" style="width:104px;white-space:nowrap;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums">${r.start}–${fromMin(toMin(r.start)+r.dur)}</div><div class="grow"><b>${o.name}</b>　${esc(r.title)}</div><span class="pill ${cls}">${lab}</span></div>`;

  return h+'</div>';
}

function ring(kid, size){
  const limit=timerLimit(kid), left=timerLeft(kid), frac=limit?left/limit:0, R=size/2-14, C=2*Math.PI*R;
  const col = left<=0?'var(--bad)': left<5*60000?'var(--warn)':'var(--main)';
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>
  <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${col}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-text" fill="var(--ink)">${fmtDur(left)}</text></svg>`;
}

/* ----- チャット（家族みんな・1対1） ----- */
const STAMPS=['👍','🎉','🙏','❤️','😂','😢','👌','💪','🍙','🏠'];
function roomOf(a,b){ return b==='all'?'all':[a,b].sort().join('~') }
function roomPeer(room, mid){ return room==='all'?null:room.split('~').find(x=>x!==mid) }
function chatMsgs(room){ return (D().chats||[]).filter(x=>x.room===room).sort((a,b)=>a.at-b.at) }
function myRooms(mid){ return ['all', ...members().filter(x=>x.id!==mid).map(x=>roomOf(mid,x.id))] }
/* 既読：人ごと・トークごとに「どこまで読んだか」を家族で共有する */
function readMap(mid){ const o={}; for(const r of (D().reads||[])) if(r.member===mid) o[r.room]=r.at; return o }
function readAt(mid, room){ return readMap(mid)[room]||0 }
function markRead(mid, room){ const l=chatMsgs(room).at(-1); if(!l||readAt(mid,room)>=l.at||markRead.busy) return; markRead.busy=true;
  setTimeout(()=>{ markRead.busy=false; Store.update(d=>{ d.reads=d.reads||[]; const id='r_'+mid+'_'+room; const r=d.reads.find(x=>x.id===id); if(r){ if(r.at>=l.at) return; r.at=l.at; r.date=today() } else d.reads.push({id, member:mid, room, at:l.at, date:today()}) }) },0) }
function readers(x){ const ids=x.room==='all'?members().map(m=>m.id):x.room.split('~'); return ids.filter(id=>id!==x.from && readAt(id,x.room)>=x.at) }
function readLabel(x){ const r=readers(x); if(!r.length) return ''; return x.room==='all'?`既読${r.length}`:'既読' }
function unread(mid, room){ const t=readMap(mid)[room]||0; return chatMsgs(room).filter(x=>x.from!==mid && x.at>t).length }
function unreadTotal(mid){ return myRooms(mid).reduce((a,r)=>a+unread(mid,r),0) }
function roomTitle(room, mid){ if(room==='all') return '👪 家族みんな'; const p=M(roomPeer(room,mid)); return p?esc(p.name):'（いない人）' }
function msgPreview(x){ if(!x) return ''; if(x.sticker) return x.sticker.startsWith('m:')?'（キャラスタンプ）':x.sticker.slice(2); return x.text }
function stickerHtml(s, size){ if(s.startsWith('m:')){ const [,t,mood]=s.split(':'); return MASCOTS[t]?mascotSvg(t,mood,size||96):'' } return `<span style="font-size:${size?size/2:48}px;line-height:1">${esc(s.slice(2))}</span>` }
function viewChat(){
  const m=me();
  if(ui.room && !myRooms(m.id).includes(ui.room)) ui.room=null;
  if(!ui.room){
    return `<div class="card"><h2>💬 チャット</h2>${myRooms(m.id).map(r=>{ const l=chatMsgs(r).at(-1), u=unread(m.id,r), p=M(roomPeer(r,m.id));
      return `<div class="row chatroom" data-act="openRoom" data-room="${r}">${p?avatar(p):'<div class="avatar" style="background:var(--main)">👪</div>'}<div class="grow" style="min-width:0"><b>${roomTitle(r,m.id)}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l?`${l.from===m.id?'あなた':esc(M(l.from)?.name||'')}：${esc(msgPreview(l))}`:'まだメッセージはないよ'}</div></div>${l?`<span class="muted" style="font-size:12px">${l.date===today()?hm(l.at):l.date.slice(5).replace('-','/')}</span>`:''}${u?`<span class="badge" style="position:static">${u}</span>`:''}</div>` }).join('')}</div>
      <p class="muted" style="text-align:center">2週間より前のメッセージは表示されません。</p>`;
  }
  const msgs=chatMsgs(ui.room), mt=mascotOf(m.id); let last='';
  const log=msgs.map(x=>{ const mine=x.from===m.id, f=M(x.from), canDel=mine||isParent(); let sep='';
    if(x.date!==last){ last=x.date; sep=`<div class="chatday">${x.date===today()?'きょう':x.date.slice(5).replace('-','/')}</div>` }
    const sel=ui.selMsg===x.id;
    return sep+`<div class="msg ${mine?'me':''}">${mine?'':(f?avatar(f):'')}<div class="mbody">${mine||ui.room!=='all'?'':`<div class="mname">${esc(f?.name||'')}</div>`}<div class="${x.sticker?'stk':'mb'}" data-act="selMsg" data-id="${x.id}">${x.sticker?stickerHtml(x.sticker):esc(x.text).replace(/\n/g,'<br>')}</div><div class="mtime">${mine&&readLabel(x)?`<span class="rd">${readLabel(x)}</span> `:''}${hm(x.at)}${sel&&x.room==='all'&&mine?`<div>${readers(x).length?'読んだ人：'+readers(x).map(id=>esc(M(id)?.name||'')).join('、'):'まだだれも読んでいないよ'}</div>`:''}${sel&&canDel?` <button class="small bad" style="padding:2px 8px;font-size:12px" data-act="delMsg" data-id="${x.id}">けす</button>`:''}</div></div></div>` }).join('');
  return `<div class="card chatcard"><div class="row" style="margin-bottom:6px"><button class="small ghost" data-act="closeRoom">‹ もどる</button><h2 class="grow" style="margin:0">${roomTitle(ui.room,m.id)}</h2></div>
    <div class="chatlog">${log||'<div class="empty">さいしょのメッセージを送ってみよう</div>'}</div>
    ${ui.stamps?`<div class="stamps">${['happy','normal','worry','angry'].map(md=>`<button class="ghost" data-act="sendStamp" data-s="m:${mt}:${md}">${mascotSvg(mt,md,52)}</button>`).join('')}${STAMPS.map(e=>`<button class="ghost" data-act="sendStamp" data-s="e:${e}" style="font-size:26px">${e}</button>`).join('')}</div>`:''}
    <form data-form="chat" class="row" style="margin-top:8px;align-items:flex-end"><button type="button" class="ghost" data-act="toggleStamps" style="padding:8px 10px;font-size:20px">${ui.stamps?'⌨️':'😀'}</button><textarea name="text" rows="1" maxlength="500" placeholder="メッセージ" class="grow" style="min-height:44px;resize:none"></textarea><button>送る</button></form></div>`;
}
let chatSeen=null;
function checkChat(){
  const m=me(); if(!m || !D()?.chats) return;
  const mine=new Set(myRooms(m.id));
  if(!chatSeen){ chatSeen=new Set(D().chats.map(x=>x.id)); return }
  for(const x of D().chats){ if(chatSeen.has(x.id)) continue; chatSeen.add(x.id);
    if(x.from===m.id || !mine.has(x.room) || now()-x.at>5*60e3) continue;
    if(ui.tab==='chat' && ui.room===x.room && document.visibilityState==='visible') continue;
    const who=M(x.from)?.name||'', t=(x.room==='all'?'家族みんな：':'')+who;
    toast(`💬 ${t}「${msgPreview(x).slice(0,30)}」`); notify(t, msgPreview(x));
  }
}
function sendChat(o){ const m=me(); Store.update(d=>{ d.chats=d.chats||[]; d.chats.push({id:uid(), room:ui.room, from:m.id, at:now(), date:today(), ...o}) }) }
function viewTimer(){
  const m=me();
  if(m.role==='kid'){
    const t=timer(m.id), left=timerLeft(m.id);
    return `<div class="card" style="text-align:center"><h2>ゲーム・動画の のこり時間</h2>${ring(m.id,260)}
      <p class="muted">${allowanceReason(m.id)} ${allowanceToday(m.id)}分${t.bought?` ＋ポイント交換 ${t.bought}分`:''}${t.extra>0?` ＋おまけ ${t.extra}分`:t.extra<0?` −${-t.extra}分`:''} ・ つかった ${Math.floor(timerUsed(m.id)/60000)}分</p>
      ${(()=>{ const why=gameLockReason(m.id), ul=usableLeft(m.id);
        if(!why && isPlanned(m.id) && ul<left-60000) return `<p style="font-weight:700;color:var(--warn)">やることのために、いま使えるのは あと ${fmtDur(ul)} まで</p>`;
        if(why && isPlanned(m.id) && !gameClosed(m.id) && left>0) return `<p style="font-weight:700;color:var(--bad)">🔒 ${why}</p>`;
        return '' })()}
      <p class="muted" style="margin-top:-4px">ゲームは ${fromMin(cutoffMin(m.id))} まで</p>
      ${!isPlanned(m.id)?'<button class="soft" style="width:100%;font-size:18px;padding:16px" data-act="tab" data-tab="home">📝 まず、やることリストをけっていしよう</button>':gameClosed(m.id)?`<h2 style="color:var(--bad)">きょうのゲームは ${fromMin(cutoffMin(m.id))} でおしまい</h2>`:left<=0?'<h2 style="color:var(--bad)" class="alarm">きょうはおしまい！</h2>':(!t.since && gameSlack(m.id)<=0)?'<button class="soft" style="width:100%;font-size:18px;padding:16px" data-act="tab" data-tab="home">🔒 先にやることを終わらせよう</button>':
        t.since?'<button class="warn" style="width:100%;font-size:20px;padding:18px" data-act="pause">⏸ ちょっと休けい（一時停止）</button>':
        '<button style="width:100%;font-size:20px;padding:18px" data-act="play">▶ スタート</button>'}
      </div>
      <div class="card"><div class="row"><h3 class="grow" style="margin:0">⭐ ポイントでゲーム時間をふやす</h3><span class="pill">${pointsTotal(m.id)} pt</span></div>
        <p class="muted" style="margin:6px 0 10px">1ポイント ＝ 1分。使ったポイントはへるよ。</p>
        ${gameClosed(m.id)?'<div class="muted">きょうはもう交換できないよ</div>':isPlanned(m.id)?(pointsTotal(m.id)<1?'<div class="muted">使えるポイントがないよ</div>':`<div class="row" style="justify-content:center;gap:12px">
          <button class="ghost" style="width:52px;height:52px;font-size:26px;padding:0" data-act="spendStep" data-n="-1">−</button>
          <div style="text-align:center"><div style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums">${spendAmt(m.id)}</div><div class="muted" style="font-size:12px">pt ＝ ${spendAmt(m.id)}分</div></div>
          <button class="ghost" style="width:52px;height:52px;font-size:26px;padding:0" data-act="spendStep" data-n="1">＋</button></div>
        <div class="chips" style="justify-content:center;margin-top:8px">${[1,5,10].filter(n=>n<=pointsTotal(m.id)).map(n=>`<button class="small soft" data-act="spendSet" data-n="${n}">${n}</button>`).join('')}<button class="small soft" data-act="spendSet" data-n="${pointsTotal(m.id)}">ぜんぶ</button></div>
        <button style="width:100%;margin-top:10px" data-act="spend" data-n="${spendAmt(m.id)}">${spendAmt(m.id)}ポイントで +${spendAmt(m.id)}分 にする</button>`):'<div class="muted">やることリストをけっていすると使えるよ</div>'}
      </div>
      ${mascotCard(m.id)}${notifState()==='granted'?'':notifCard()}<div class="card"><p class="muted">やめるときは「一時停止」を押すと、のこりがとっておけるよ。アプリを閉じても時間はとまらないので注意！</p></div>`;
  }
  return `<div class="card"><h2>みんなの のこり時間</h2>${kids().map(k=>{
    const t=timer(k.id), left=timerLeft(k.id), lim=timerLimit(k.id);
    return `<div class="kid-timer" style="padding:10px 0;border-top:1px solid var(--line)">${avatar(k)}<div class="grow"><div class="row"><b class="grow">${k.name}</b>${gameClosed(k.id)?'<span class="pill bad">終了</span>':t.since?'<span class="pill warn">つかってる</span>':left<=0?'<span class="pill bad">おしまい</span>':gameSlack(k.id)<=0?'<span class="pill bad">🔒やること優先</span>':'<span class="pill gray">とまってる</span>'}<b style="font-variant-numeric:tabular-nums;font-size:20px">${fmtDur(left)}</b></div>
      <div class="bar" style="margin:6px 0"><i style="width:${lim?left/lim*100:0}%;background:${k.color}"></i></div>
      <div class="muted" style="font-size:13px">おまけ：${t.extra>0?'+':''}${t.extra||0}分${t.bought?` ・ ポイント交換：+${t.bought}分`:''}</div>
      <div class="row wrapr" style="gap:6px;margin-top:4px"><button class="small soft" data-act="extend" data-id="${k.id}" data-n="-5">−5分</button><button class="small soft" data-act="extend" data-id="${k.id}" data-n="5">+5分</button><button class="small soft" data-act="extend" data-id="${k.id}" data-n="15">+15分</button><button class="small ghost" data-act="clearExtra" data-id="${k.id}" ${t.extra?'':'disabled'}>おまけを消す</button>${t.since?`<button class="small warn" data-act="pause" data-id="${k.id}">止める</button>`:''}</div></div></div>`}).join('')}
    </div><p class="muted">持ち時間は「おや」ページで変えられます。</p>`;
}

/* ----- おや ----- */
function viewParent(){
  const d=D(); let h='';
  const pr=d.routines.filter(r=>r.status==='pending');
  const rv=d.logs.filter(l=>l.state==='review'), ex=d.logs.filter(l=>l.state==='excuse');
  h+=`<div class="card"><h2>確認すること</h2>`;
  if(!pr.length&&!rv.length&&!ex.length) h+='<div class="empty">いまはありません 👍</div>';
  for(const r of pr) h+=`<div class="routine"><div class="grow"><b>${M(r.owner).name}：${esc(r.title)}</b><div class="muted">新しいルーチン ・ ${schedLabel(r)} ${r.dur}分</div></div><button class="small soft" data-act="rejRoutine" data-id="${r.id}">NG</button><button class="small" data-act="okRoutine" data-id="${r.id}">OK</button></div>`;
  for(const l of rv){ const r=d.routines.find(x=>x.id===l.routine); h+=`<div class="routine"><div class="grow"><b>${M(l.member).name}：${esc(r?.title)}</b><div class="muted">予定${r?.dur}分のところ ${Math.max(1,Math.round((l.endedAt-l.startedAt)/60000))}分で終了。本当にできた？</div></div><button class="small soft" data-act="redo" data-id="${l.id}">やり直し</button><button class="small" data-act="okLog" data-id="${l.id}">OK</button></div>` }
  for(const l of ex){ const r=d.routines.find(x=>x.id===l.routine); h+=`<div class="routine"><div class="grow"><b>${M(l.member).name}：${esc(r?.title)}</b><div class="muted">できなかった理由：「${esc(l.reason)}」</div></div><button class="small bad" data-act="skipLog" data-id="${l.id}">減点</button><button class="small" data-act="excuseOk" data-id="${l.id}">OK</button></div>` }
  h+='</div>';
  const missed=todaysRoutines().filter(r=>routineState(r)==='missed');
  if(missed.length) h+=`<div class="card"><h2>きょう、まだのルーチン</h2>${missed.map(r=>`<div class="routine"><div class="grow"><b>${M(r.owner).name}：${esc(r.title)}</b><div class="muted">${r.start}〜 理由はまだ届いていません</div></div><button class="small bad" data-act="skipRoutine" data-id="${r.id}">サボり減点</button></div>`).join('')}<p class="muted">まずは本人に声をかけて、理由を書いてもらうのがおすすめです。</p></div>`;
  h+=`<div class="card"><h2>みんなのルーチン</h2>${kids().map(k=>{const rs=d.routines.filter(r=>r.owner===k.id&&r.status==='approved');return `<h3 style="margin-top:12px">${k.name}</h3>${rs.map(r=>`<div class="routine"><div class="time">${r.kind==='dates'?'📅':r.start}</div><div class="grow">${esc(r.title)}<div class="muted">${schedLabel(r)}・${r.dur}分</div></div><button class="small soft" data-act="editRoutine" data-id="${r.id}">直す</button></div>`).join('')||'<div class="muted">なし</div>'}`}).join('')}</div>`;
  h+=`<div class="card"><h2>設定</h2><form data-form="settings">
    ${kids().map(k=>`<div class="kidset"><div class="row">${avatar(k)}<h3 class="grow" style="margin:0">${esc(k.name)}</h3><label style="margin:0;white-space:nowrap"><input type="checkbox" name="sm_${k.id}" ${d.settings.simple[k.id]?'checked':''} style="width:auto"> 大きい表示</label></div>
      <label>ゲーム時間（分）曜日ごと</label>
      <div class="dowgrid">${DOW.map((w,i)=>`<label class="${i===0||i===6?'we':''}"><span>${w}</span><input type="number" inputmode="numeric" name="ad_${k.id}_${i}" min="0" max="600" value="${allowanceDow(k.id,i)}"></label>`).join('')}</div>
      <label>特定の日だけ変える（テスト前、旅行など）</label>
      ${Object.entries(d.settings.allowanceDate?.[k.id]||{}).filter(([x])=>x>=today()).sort().map(([x,v])=>`<div class="row" style="padding:2px 0"><b class="grow">${mdLabel(x)}</b><span>${v}分</span><button type="button" class="small ghost" data-act="rmOverride" data-id="${k.id}" data-date="${x}">×</button></div>`).join('')}
      <div class="row"><input type="date" id="ovd_${k.id}" min="${today()}" class="grow"><input type="number" id="ovm_${k.id}" min="0" max="600" placeholder="分" style="width:80px"><button type="button" class="small soft" data-act="addOverride" data-id="${k.id}">追加</button></div>
      <div class="row"><div class="grow"><label>ゲームは何時まで（空欄＝夜の締め切り）</label><input type="time" name="gc_${k.id}" value="${d.settings.gameCutoff?.[k.id]||''}"></div></div>
      <div class="row"><div class="grow"><label>家を出る時間（平日）</label><input type="time" name="dep_${k.id}" value="${d.settings.depart?.[k.id]||''}"></div><div class="grow"><label>寝る時間</label><input type="time" name="bed_${k.id}" value="${d.settings.bedtime?.[k.id]||'21:00'}"></div></div><div class="row"><div class="grow"><label>キャラクター</label><select name="ms_${k.id}">${MASCOT_ORDER.map(t=>`<option value="${t}" ${mascotOf(k.id)===t?'selected':''}>${MASCOTS[t].name}（${MASCOTS[t].desc}）</option>`).join('')}</select></div></div></div>`).join('')}
    <label>🎁 締め切りまでにやることを全部終えたら、もらえるポイント（0で なし・自動）</label>
    <div class="row"><div class="grow"><label style="margin-top:0">朝</label><input type="number" name="bonusam" min="0" max="100" value="${bonusPts('am')}"></div><div class="grow"><label style="margin-top:0">夜</label><input type="number" name="bonus" min="0" max="100" value="${bonusPts('pm')}"></div></div>
    <div class="row"><div class="grow"><label>夜の締め切り：寝る何分前？</label><input type="number" name="dlbuf" min="0" max="180" value="${deadlineBuf()}"></div><div class="grow"><label>朝の締め切り：家を出る何分前？</label><input type="number" name="mbuf" min="0" max="60" value="${D().settings.morningBuffer ?? 10}"></div></div>
    <h3 style="margin-top:20px">写真</h3><p class="muted">アイコンにする写真をえらんでください（この家族の端末だけで見られます）。</p>
    ${members().map(m=>`<div class="row" style="padding:6px 0">${avatar(m)}<b class="grow">${esc(m.name)}</b><label class="soft small" style="margin:0;padding:8px 12px;border-radius:12px;background:var(--main-soft);color:var(--main);font-weight:700;cursor:pointer">写真をえらぶ<input type="file" accept="image/*" data-photo="${m.id}" style="display:none"></label>${m.photo?`<button type="button" class="ghost small" data-act="rmPhoto" data-id="${m.id}">はずす</button>`:''}</div>`).join('')}
    <div class="row">${members().filter(m=>m.role==='parent').map(m=>`<div class="grow"><label>${esc(m.name)}の新しいPIN</label><input name="pin_${m.id}" inputmode="numeric" maxlength="4" placeholder="変えるときだけ"></div>`).join('')}</div>
    <button style="width:100%;margin-top:16px">設定をほぞん</button>
    </form></div>
    ${d.joinCode?`<div class="card"><h2>家族の端末をふやす</h2><p class="muted">ほかのスマホでこのアプリを開き、「家族コードで参加」にこのコードを入れてください。</p><div style="font-size:30px;font-weight:800;letter-spacing:.15em;text-align:center;margin:12px 0;font-variant-numeric:tabular-nums">${d.joinCode}</div></div>`:''}
    ${notifCard()}
    <div class="card"><span class="muted" style="float:right">${APP_VERSION}</span><button class="ghost small" data-act="reset">${Backend===LocalBackend?'データをすべて消す':'この端末を家族から外す'}</button></div>`;
  return h;
}

/* ---------- Actions ---------- */
function askConfirm(msg, fn){ ui.confirmFn=fn; ui.modal=()=>`<h2>${esc(msg)}</h2><div class="row" style="margin-top:16px"><button class="ghost grow" data-act="closeModal">やめる</button><button class="bad grow" data-act="confirmYes">はい</button></div>`; render() }
/* 通知：AndroidのChromeは new Notification() が使えないので、Service Worker 経由で出す */
let audioCtx=null;
function beep(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime;
  [0,0.25].forEach(d=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; g.gain.setValueAtTime(0.25,t+d); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.2); o.connect(g).connect(audioCtx.destination); o.start(t+d); o.stop(t+d+0.21) }) }catch(e){} }
async function notify(title, body){
  beep();
  try{ navigator.vibrate && navigator.vibrate([300,150,300]) }catch(e){}
  notify.last='';
  if(!('Notification' in window)){ notify.last='Notification APIなし'; return false }
  if(Notification.permission!=='granted'){ notify.last='許可: '+Notification.permission; return false }
  try{
    if('serviceWorker' in navigator){
      let reg=await navigator.serviceWorker.getRegistration();
      if(!reg) reg=await navigator.serviceWorker.register('sw.js');
      reg=await Promise.race([navigator.serviceWorker.ready, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Service Workerの準備がタイムアウト')),4000))]);
      await reg.showNotification(title,{body, icon:'icon-192.png', badge:'icon-192.png', vibrate:[300,150,300], tag:'family-'+Date.now(), requireInteraction:false});
      const shown=await reg.getNotifications().catch(()=>null);
      notify.last='showNotification OK'+(shown?`（表示中 ${shown.length}件）`:'');
      return true;
    }

async function notifDiag(){
  const L=[]; const add=(k,v)=>L.push(`<tr><td class="muted" style="padding-right:10px;white-space:nowrap">${k}</td><td>${esc(v)}</td></tr>`);
  add('アプリ', APP_VERSION);
  add('通知の許可', 'Notification' in window ? Notification.permission : 'なし');
  add('Service Worker', 'serviceWorker' in navigator ? 'あり' : 'なし');
  try{ const r=await navigator.serviceWorker.getRegistration(); add('SW登録', r ? `${r.active?'active':r.installing?'installing':r.waiting?'waiting':'?'} (${r.scope})` : 'なし'); add('SW制御中', navigator.serviceWorker.controller?'はい':'いいえ') }catch(e){ add('SW登録','エラー '+e.message) }
  add('開き方', matchMedia('(display-mode: standalone)').matches ? 'ホーム画面アプリ' : 'ブラウザ');
  add('結果', notify.last||'-');
  const ua=navigator.userAgent.match(/Android [\d.]+|Chrome\/[\d.]+|SamsungBrowser\/[\d.]+|Line\/[\d.]+/g);
  add('端末', ua?ua.join(' / '):navigator.userAgent.slice(0,80));
  return `<table style="font-size:13px;border-collapse:collapse;margin-top:8px">${L.join('')}</table>`;
}

      for(const m of members().filter(m=>m.role==='parent')){ const v=(fd.get('pin_'+m.id)||'').trim(); if(!v) continue; if(!/^\d{4}$/.test(v)) return toast('PINは4けたの数字にしてください'); pins[m.id]=await sha(v) }
      Store.update(d=>{ const s=d.settings; s.allowanceWeekend=s.allowanceWeekend||{}; s.bedtime=s.bedtime||{}; s.mascot=s.mascot||{};
        s.bonusPoints=Math.max(0, Number(fd.get('bonus'))||0); s.bonusPointsAM=Math.max(0, Number(fd.get('bonusam'))||0);
        s.deadlineBuffer=Math.max(0, Number(fd.get('dlbuf'))||0); s.morningBuffer=Math.max(0, Number(fd.get('mbuf'))||0); s.depart=s.depart||{};
        s.allowanceDow=s.allowanceDow||{};
        for(const k of kids()){ s.allowanceDow[k.id]=DOW.map((_,i)=>Math.max(0, Number(fd.get('ad_'+k.id+'_'+i))||0)); s.bedtime[k.id]=fd.get('bed_'+k.id)||'21:00'; s.depart[k.id]=fd.get('dep_'+k.id)||''; (s.gameCutoff=s.gameCutoff||{})[k.id]=fd.get('gc_'+k.id)||''; s.mascot[k.id]=fd.get('ms_'+k.id); s.simple[k.id]=!!fd.get('sm_'+k.id) }
        Object.assign(s.pins,pins) });
      toast('設定をほぞんしました');
    })();
  }
}

app.addEventListener('change', e=>{
  trackDraft(e);
  const id=e.target.dataset?.photo; if(!id || !e.target.files[0]) return;
  const img=new Image(), url=URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{ const S=160, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d'), m=Math.min(img.width,img.height);
    g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S); URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',0.8); Store.update(d=>{ const mm=d.members.find(x=>x.id===id); if(mm) mm.photo=data }); toast('写真を設定しました') };
  img.onerror=()=>toast('この写真は読みこめませんでした');
  img.src=url;
});

/* ---------- Tick: タイマーの自動停止と予告 ---------- */
const warned={}; let tickN=0;
setInterval(()=>{
  let changed=false;
  if(Store.state!=='ready') return;
  for(const k of kids()){
    const tt=Store.data.timers[timerKey(k.id)];
    // 決めた時刻になったら、その日のゲーム時間は終了（のこりはリセット）
    if(nowMin()>=cutoffMin(k.id) && (!tt || !tt.closed)){ const c=Store.data.timers[timerKey(k.id)]||(Store.data.timers[timerKey(k.id)]={used:0,since:null,extra:0}); const lost=Math.ceil(timerLeft(k.id)/60000); if(c.since){ c.used+=now()-c.since; c.since=null } c.closed=true; c.forfeit=lost; changed=true; if(lost>0) notify(`${k.name}：きょうのゲームはおしまい`, `のこり${lost}分はリセットされました`); continue }
    const t=tt; if(!t||!t.since) continue;
    if(gameSlack(k.id)<=0){ t.used+=now()-t.since; t.since=null; changed=true; notify(`${k.name}：ゲームをいったんストップ`, 'このままだとやることが締め切りに間に合わないよ'); if(me()?.id===k.id){ const type=mascotOf(k.id); setTimeout(()=>showMascot({type, mood:'angry', level:'strict', text:pickLine(type,'gameLock',{d:fromMin(deadlineMin(k.id))})}),50) } continue }
    const left=timerLeft(k.id);
    if(left<=0){ t.used=timerLimit(k.id); t.since=null; changed=true; notify(`${k.name}：きょうの時間はおしまい`, 'おつかれさま！'); }
    else if(left<5*60000 && !warned[k.id]){ warned[k.id]=true; notify(`${k.name}：のこり5分`, 'そろそろ区切りをつけよう'); }
  }
  if(changed) Store.update(()=>{});
  if(Backend===FireBackend && FireBackend.fid && FireBackend.day!==today()) FireBackend.listen();
  if(me() && (ui.tab==='timer'||ui.tab==='home') && !ui.modal){ render.soft=true; render(); render.soft=false }
  checkChat();
  if(++tickN%5===0){ for(const k of kids()) checkBonus(k.id); checkMascotAlert() }
},1000);

const APP_VERSION='v23';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ r.update(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) r.update() }) }).catch(()=>{});
Backend.start().catch(e=>{ console.error(e); Store.state='nofamily'; ui.error='サーバーにつながりませんでした：'+e.message; render() });
render();
</script>
